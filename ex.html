<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EX Desk · Mewtoy Expense</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16211c;--mute:#5f6d66;--line:#dce3df;--acc:#0b7a4b;--acc2:#e2f2ea;--warn:#a15c07;--warn2:#fdf1d6;--red:#b42318;--red2:#fde4e1;--blue:#1d4ed8;--blue2:#e3ebff;--vio:#6d28d9;--vio2:#efe7ff;--chip:#eef2f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111614;--card:#1a211e;--ink:#e5ebe8;--mute:#98a69f;--line:#2b3531;--acc2:#15352a;--warn2:#3a2b10;--red2:#3d1714;--blue2:#18264a;--vio2:#2a1d48;--chip:#232c28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;padding:0 16px 40px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 0 8px}
header h1{font-size:19px;margin:0}header .v{font-size:11.5px;color:var(--mute)}
select,input,button,textarea{font:inherit;color:inherit}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 12px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
button.bad{color:var(--red);border-color:var(--red2)}
button.sm{padding:3px 9px;font-size:12.5px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
a{color:var(--blue)}
.who-bar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.who-bar button{border-radius:16px;padding:4px 14px}
.who-bar button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi small{color:var(--mute);display:block;font-size:12px}.kpi b{font-size:21px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--mute)}
.kpi.w b{color:var(--warn)}.kpi.r b{color:var(--red)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--mute);white-space:nowrap}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.tabs .n{background:var(--warn2);color:var(--warn);border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}
.panel+.panel{margin-top:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar .sp{flex:1}
.row{display:grid;grid-template-columns:22px 86px 1fr 80px 100px auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
@media(max-width:720px){.row{grid-template-columns:22px 1fr auto;grid-template-areas:"c t a" ". x x"}.row .d,.row .who{display:none}
 .row>:first-child{grid-area:c}.row .t{grid-area:t}.row .amt{grid-area:a}.row .acts{grid-area:x;justify-content:flex-start}}
.row .t{cursor:pointer;min-width:0}.row .t b{display:block}.row .t small{color:var(--mute);display:block;overflow-wrap:anywhere}
.amt{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;background:var(--chip);color:var(--mute);white-space:nowrap}
.p-new{background:var(--warn2);color:var(--warn)}.p-ok{background:var(--acc2);color:var(--acc)}.p-paid{background:var(--blue2);color:var(--blue)}.p-no{background:var(--red2);color:var(--red)}
.p-rb{background:var(--blue2);color:var(--blue)}.p-goods{background:var(--vio2);color:var(--vio)}
.dot{width:22px;height:28px;border-radius:4px;background:var(--chip);display:grid;place-items:center;font-size:12px}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.cut{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:10px;align-items:end;padding:12px}
@media(max-width:720px){.cut{grid-template-columns:1fr 1fr}}
.f{display:grid;gap:4px}.f label{font-size:12px;color:var(--mute)}.f input,.f select,.f textarea{width:100%}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.mt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.mt th,.mt td{padding:7px 10px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}.mt .n{text-align:right}
.mt th{color:var(--mute);font-weight:500}
.chart{padding:14px 12px;display:grid;gap:8px}
.cr{display:grid;grid-template-columns:140px 1fr 90px;gap:10px;align-items:center;font-size:13px}
@media(max-width:520px){.cr{grid-template-columns:100px 1fr 70px}}
.track{height:14px;background:var(--chip);border-radius:4px;overflow:hidden;display:flex}.fill{height:100%;background:var(--acc)}.fill.g{background:var(--vio)}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:5}
.drawer .in{width:min(480px,100%);height:100%;background:var(--card);padding:16px;overflow:auto;display:grid;gap:12px;align-content:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.goods{border:1px dashed var(--vio);border-radius:8px;padding:10px;display:grid;gap:10px;background:var(--vio2)}
.goods>b{color:var(--vio);font-size:13px}
.gi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:8px}
.ocr{font-size:11.5px;color:var(--mute);background:var(--chip);border-radius:6px;padding:8px;white-space:pre-wrap;max-height:160px;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:90vw}
.toast.err{background:var(--red);color:#fff}
.busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--acc);animation:b 1s linear infinite;z-index:30}
@keyframes b{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
.empty{padding:24px;text-align:center;color:var(--mute)}
.hint{font-size:12px;color:var(--mute);padding:0 12px 12px}
.login{max-width:340px;margin:12vh auto;display:grid;gap:12px}
.login h1{font-size:22px;margin:0}
.grp{padding:8px 12px;background:var(--chip);font-size:12.5px;font-weight:600;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:10;padding:16px}
.modal .in{background:var(--card);border-radius:10px;width:min(560px,100%);max-height:85vh;overflow:auto;padding:14px;display:grid;gap:10px}
.cand{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.cand small{color:var(--mute);display:block}
@media (prefers-reduced-motion:reduce){.busy{animation:none}}
</style></head><body><div class="wrap" id="app"></div>
<script>
/* EX Desk · ex-html-2026-11-09-a · ใช้คู่กับ ex_backend.gs ex-2026-11-09-a */
const VERSION='ex-html-2026-11-09-a';
const API_URL_DEFAULT='https://script.google.com/macros/s/AKfycbzwApo1tdngeEydvZKc9XMQ34RxcR5xJhdkD9NyZBBTaDD4tUElgkO_tATR2OPJEc7fNQ/exec';   // URL /exec ของ EX (Apps Script) · เปลี่ยนได้ที่ ⚙️
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
let API=ls.get('ex_api')||API_URL_DEFAULT, PIN=ss.get('ex_pin')||'', ME=null, D=null;
let payee='', tab='queue', who='', month='', sel=new Set(), cutWho='', cutDate='', ex=new Set(), f={st:'',cat:'',q:''}, gsel=new Set();
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{if(!s)return '-';const[y,mo,d]=s.split('-');return d+' '+MON[mo-1]+' '+y.slice(2)};
const fm=ym=>{const[y,mo]=ym.split('-');return MON[mo-1]+' '+y.slice(2)};
const pc=s=>({'รอตรวจ':'p-new','อนุมัติ':'p-ok','คืนแล้ว':'p-paid','ไม่เบิก':'p-no','ยกเลิก':'p-no','รอจ่าย':'p-new','จ่ายแล้ว':'p-paid','รอของ':'p-new','ของถึงแล้ว':'p-ok'})[s]||'';
const live=x=>x.st!=='ยกเลิก'&&x.st!=='ไม่เบิก';
const mine=x=>!who||x.who===who;
const sum=a=>a.reduce((s,x)=>s+(x.amt||0),0);
const isGoods=cat=>(D.cats.find(c=>c.name===cat)||{}).type==='สินค้า';
const goodsOf=id=>D.goods.filter(g=>g.exp===id);
function toast(t,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),err?4500:2000)}
function busy(on){let b=$('.busy');if(on&&!b){b=document.createElement('div');b.className='busy';document.body.append(b)}if(!on&&b)b.remove()}

async function api(action,payload){
  if(!API)throw new Error('ยังไม่ได้ตั้ง URL ของระบบ (กด ⚙️)');
  busy(true);
  try{
    const r=await fetch(API,{method:'POST',body:JSON.stringify({api:true,pin:PIN,action,payload})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'ผิดพลาด');
    return j.data;
  }finally{busy(false)}
}
async function act(action,payload,msg){
  try{const r=await api(action,payload);if(msg)toast(typeof msg==='function'?msg(r):msg);await reload();return r}
  catch(e){toast(e.message,true);if(/PIN/.test(e.message))logout();return null}
}
async function reload(){D=await api('load',{});if(!month)month=(D.now||'').slice(0,7);if(!cutDate)cutDate=D.now;render()}
function logout(){PIN='';ss.del('ex_pin');ME=null;D=null;renderLogin()}

/* ---------- login ---------- */
function renderLogin(){
  $('#app').innerHTML=`<div class="login panel" style="padding:20px">
   <h1>EX Desk</h1><div style="color:var(--mute);font-size:13px">Mewtoy Expense · ตรวจบิล ตัดยอดเบิก สินค้ารอเข้า</div>
   <div class="f"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></div>
   <button class="pri" id="go">เข้าสู่ระบบ</button>
   <button id="cfg">⚙️ ตั้ง URL ระบบ</button>
   <div style="font-size:11px;color:var(--mute)">${VERSION}${API?'':' · ยังไม่ได้ตั้ง URL'}</div></div>`;
  const go=async()=>{PIN=$('#pin').value.trim();try{ME=await api('login',{});ss.set('ex_pin',PIN);await reload()}catch(e){toast(e.message,true)}};
  $('#go').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};$('#cfg').onclick=cfg;$('#pin').focus();
}
function cfg(){const u=prompt('URL ของ Apps Script (ลงท้าย /exec)',API||'');if(u!==null){API=u.trim();ls.set('ex_api',API);toast('บันทึก URL แล้ว')}}

/* ---------- helpers ---------- */
function eligibility(b){
  if(b.st!=='อนุมัติ')return 'ยังไม่อนุมัติ';
  if(b.pay!=='ส่วนตัว')return 'จ่ายด้วยเงินบริษัท';
  if(b.rb)return 'อยู่ในรอบ '+b.rb;
  if(b.paym==='SPayLater'){const gs=goodsOf(b.id);if(!gs.length)return 'SPayLater: ยังไม่ใส่รายการสินค้า';if(gs.some(g=>g.st!=='ของถึงแล้ว'))return 'SPayLater: รอของถึงก่อน'}
  return '';
}
const buyers=()=>(D.lists&&D.lists.buyers&&D.lists.buyers.length?D.lists.buyers:[ME?ME.name:'']);
const people=()=>[...new Set([...(D.people||[]),...D.bills.map(b=>b.who)].filter(Boolean))];
const months=()=>{const s=new Set(D.bills.map(b=>b.d.slice(0,7)).filter(Boolean));s.add((D.now||'').slice(0,7));return [...s].sort().reverse()};

/* ---------- main ---------- */
function render(){
  if(!D)return renderLogin();
  if(!cutWho)cutWho=people()[0]||'';
  const nq=D.bills.filter(x=>mine(x)&&x.st==='รอตรวจ').length;
  const ng=D.goods.filter(g=>g.st!=='ของถึงแล้ว').length;
  $('#app').innerHTML=`<header><div><h1>EX Desk</h1><div class="v">Mewtoy Expense · ${esc(ME?ME.name:'')} · ${esc(D.version)} / ${VERSION}</div></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><select id="month" aria-label="เดือน">${months().map(x=>`<option value="${x}" ${x===month?'selected':''}>${fm(x)}</option>`).join('')}</select>
   <button id="rf">↻ ดึงข้อมูลล่าสุด</button><button id="cfgb" aria-label="ตั้งค่า">⚙️</button><button id="out">ออก</button></div></header>
   <div class="who-bar" role="group" aria-label="เลือกคน">${['',...people()].map(p=>`<button class="${who===p?'on':''}" data-who="${esc(p)}">${esc(p||'ทุกคน')}</button>`).join('')}</div>
   <section class="kpis">${kpis()}</section>
   <nav class="tabs" id="tabs">${[['queue','รอตรวจ',nq],['cut','ตัดยอดเบิก'],['rounds','ประวัติรอบเบิก'],['goods','สินค้ารอเข้า',ng],['all','บิลทั้งหมด'],['sum','สรุป']]
     .map(([k,l,n])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}${n?`<span class="n">${n}</span>`:''}</button>`).join('')}</nav>
   <main id="view">${({queue:vQueue,cut:vCut,rounds:vRounds,goods:vGoods,all:vAll,sum:vSum})[tab]()}</main>`;
}
function kpis(){
  const L=D.bills.filter(x=>live(x)&&mine(x)&&x.d.slice(0,7)===month);
  const exp=L.filter(x=>!isGoods(x.cat)),gd=L.filter(x=>isGoods(x.cat));
  const q=D.bills.filter(x=>mine(x)&&x.st==='รอตรวจ');
  const owe=D.bills.filter(x=>mine(x)&&x.pay==='ส่วนตัว'&&x.st==='อนุมัติ'&&!x.rb);
  const wait=D.rounds.filter(r=>(!who||r.who===who)&&r.st==='รอจ่าย');
  const lastR=D.rounds.filter(r=>(!who||r.who===who)&&r.st!=='ยกเลิก').sort((a,b)=>b.cut.localeCompare(a.cut))[0];
  return `<div class="kpi"><small>ค่าใช้จ่าย ${fm(month)}${who?' · '+esc(who):''}</small><b>${m(sum(exp))}</b> <span>${exp.length} บิล${gd.length?` · สินค้า ${m(sum(gd))}`:''}</span></div>
  <div class="kpi w"><small>รอตรวจ</small><b>${m(sum(q))}</b> <span>${q.length} บิล</span></div>
  <div class="kpi r"><small>อนุมัติแล้ว ยังไม่ตัดยอด</small><b>${m(sum(owe))}</b> <span>${owe.length} บิล</span></div>
  <div class="kpi"><small>ตัดยอดแล้ว รอจ่าย</small><b>${m(wait.reduce((s,r)=>s+r.amt,0))}</b> <span>${wait.length} รอบ${lastR?' · ตัดล่าสุด '+fd(lastR.cut):''}</span></div>`;
}
function row(x,mode){
  const lead=mode==='q'?`<input type="checkbox" aria-label="เลือก ${x.id}" data-sel="${x.id}" ${sel.has(x.id)?'checked':''}>`
    :mode==='c'?`<input type="checkbox" aria-label="รวม ${x.id}" data-ex="${x.id}" ${ex.has(x.id)?'':'checked'}>`:`<div class="dot">${x.file?'📄':'✎'}</div>`;
  const gs=goodsOf(x.id);
  const tags=(isGoods(x.cat)?` <span class="pill p-goods">สินค้า${gs.length?'':' · ยังไม่ใส่รายการ'}</span>`:'')+(x.rb?` <span class="pill p-rb">${esc(x.rb)}</span>`:'')+(x.paym==='SPayLater'?' <span class="pill p-new">SPayLater</span>':'');
  const sub=gs.length?gs.map(g=>`${esc(g.name)} ×${g.qty}`).join(' · ')+' · '+esc(x.br):`${x.id} · ${esc(x.br)} · ${x.pay==='ส่วนตัว'?'เงินส่วนตัว':'เงินบริษัท'}${x.paym?' · '+esc(x.paym):''}`;
  const act=mode==='q'?`<button class="pri sm" data-ok="${x.id}">อนุมัติ</button><button class="bad sm" data-no="${x.id}">ไม่เบิก</button>`
    :mode==='c'?'':`<span class="pill ${pc(x.st)}">${esc(x.st)}</span>`;
  return `<div class="row">${lead}<div class="d">${fd(x.d)}</div>
   <div class="t" data-open="${x.id}"><b>${esc(x.cat)} · ${esc(x.desc||'-')}${tags}</b><small>${sub}</small></div>
   <div class="who">${esc(x.who)}</div><div class="amt">${m(x.amt)}</div><div class="acts">${act}</div></div>`;
}
function vQueue(){
  const q=D.bills.filter(x=>mine(x)&&x.st==='รอตรวจ').sort((a,b)=>b.d.localeCompare(a.d));
  return `<div class="panel"><div class="bar"><b>บิลรอตรวจ ${q.length} ใบ</b><span class="sp"></span>
   <button id="selAll">เลือกทั้งหมด</button><button class="pri" id="okSel" ${sel.size?'':'disabled'}>อนุมัติที่เลือก (${sel.size})</button></div>
   ${q.map(x=>row(x,'q')).join('')||'<div class="empty">ไม่มีบิลรอตรวจ</div>'}</div>`;
}
function vCut(){
  const mineP=D.bills.filter(x=>x.who===cutWho&&x.pay==='ส่วนตัว'&&x.st==='อนุมัติ'&&!x.rb);
  const c=mineP.filter(x=>x.d<=cutDate&&!eligibility(x)),inc=c.filter(x=>!ex.has(x.id));
  const blocked=mineP.filter(x=>x.d<=cutDate&&eligibility(x));
  const later=mineP.filter(x=>x.d>cutDate);
  const last=D.rounds.filter(r=>r.who===cutWho&&r.st!=='ยกเลิก').sort((a,b)=>b.cut.localeCompare(a.cut))[0];
  return `<div class="panel"><div class="bar"><b>ตัดยอดเบิกคืน</b><span class="sp"></span><span class="pill">${last?`รอบล่าสุดของ ${esc(cutWho)}: ${last.id} ตัดถึง ${fd(last.cut)} (${last.st})`:'ยังไม่เคยตัดยอด'}</span></div>
   <div class="cut">
    <div class="f"><label for="cw">คนที่เบิก</label><select id="cw">${people().map(p=>`<option ${p===cutWho?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
    <div class="f"><label for="cd">วันที่ตัดยอด (รวมบิลถึงวันนี้)</label><input type="date" id="cd" value="${cutDate}"></div>
    <div class="f"><label for="cp">ผู้รับเงิน (ในใบสำคัญจ่าย)</label><select id="cp">${buyers().map(b=>`<option ${b===(payee||buyers()[0])?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
    <div class="f"><label>ยอดรอบนี้</label><div class="big">${m(sum(inc))} <small style="font-size:13px;color:var(--mute);font-weight:400">${inc.length} บิล</small></div></div>
    <button class="pri" id="doCut" ${inc.length?'':'disabled'}>ตัดยอด → สร้างรอบ</button></div>

function vSum(){
  const L=D.bills.filter(x=>live(x)&&mine(x)&&x.d.slice(0,7)===month),by={};L.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
  const mx=Math.max(...Object.values(by),1),e1=sum(L.filter(x=>!isGoods(x.cat))),gd=sum(L.filter(x=>isGoods(x.cat)));
  const ms=months().slice(0,6).reverse(),H=ms.map(k=>{const A=D.bills.filter(x=>live(x)&&mine(x)&&x.d.slice(0,7)===k);return [k,sum(A.filter(x=>!isGoods(x.cat))),sum(A.filter(x=>isGoods(x.cat)))]});
  const hm=Math.max(...H.map(h=>h[1]+h[2]),1);
  return `<div class="panel"><div class="bar"><b>ตามหมวด · ${fm(month)}${who?' · '+esc(who):''}</b><span class="sp"></span><span>ค่าใช้จ่าย ${m(e1)} · สินค้า ${m(gd)}</span></div>
   <div class="chart">${Object.keys(by).sort((a,b)=>by[b]-by[a]).map(c=>`<div class="cr"><span>${esc(c)}</span><div class="track"><div class="fill ${isGoods(c)?'g':''}" style="width:${by[c]/mx*100}%"></div></div><span class="amt">${m(by[c])}</span></div>`).join('')||'<div class="empty">ไม่มีข้อมูล</div>'}</div></div>
   <div class="panel"><div class="bar"><b>6 เดือนล่าสุด</b><span class="sp"></span><span class="pill p-ok">ค่าใช้จ่าย</span><span class="pill p-goods">สินค้า</span></div>
   <div class="chart">${H.map(([k,a,b])=>`<div class="cr"><span>${fm(k)}</span><div class="track"><div class="fill" style="width:${a/hm*100}%"></div><div class="fill g" style="width:${b/hm*100}%"></div></div><span class="amt">${m(a+b)}</span></div>`).join('')}</div></div>`;
}

function bahtText(n){
  const Dg=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const rd=s=>{let o='';const L=s.length;for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;
    if(p===0&&d===1&&L>1)o+='เอ็ด';else if(p===1&&d===2)o+='ยี่';else if(p===1&&d===1)o+='';else o+=Dg[d];o+=P[p]}return o};
  const big=s=>{if(s.length>6)return big(s.slice(0,-6))+'ล้าน'+rd(s.slice(-6).replace(/^0+/,'')||'0');return rd(s.replace(/^0+/,'')||'0')};
  const [b,st]=Number(n).toFixed(2).split('.');
  return ((+b?big(b)+'บาท':'')||'ศูนย์บาท')+(+st?big(st)+'สตางค์':'ถ้วน');
}

document.addEventListener('click',async e=>{
  const t=e.target,ds=t.dataset||{};

  if(t.id==='cfgb')return cfg();
  if(ds.who!==undefined){who=ds.who;if(who)cutWho=who;ex.clear();sel.clear();render();return}
  const tb=t.closest&&t.closest('#tabs button');if(tb){tab=tb.dataset.t;render();return}
  if(ds.ok)return act('setStatus',{ids:[ds.ok],status:'อนุมัติ'},'อนุมัติ '+ds.ok);
  if(ds.no)return act('setStatus',{ids:[ds.no],status:'ไม่เบิก'},'ไม่เบิก '+ds.no);
  if(t.id==='selAll'){D.bills.filter(x=>mine(x)&&x.st==='รอตรวจ').forEach(x=>sel.add(x.id));render();return}
  if(t.id==='okSel'){const ids=[...sel];sel.clear();return act('setStatus',{ids,status:'อนุมัติ'},r=>'อนุมัติ '+r.n+' บิล')}
  if(t.id==='doCut'){
    const ids=D.bills.filter(x=>x.who===cutWho&&x.pay==='ส่วนตัว'&&x.st==='อนุมัติ'&&!x.rb&&x.d<=cutDate&&!eligibility(x)&&!ex.has(x.id)).map(x=>x.id);
    if(!confirm(`ตัดยอด ${cutWho} ถึง ${fd(cutDate)} · ${ids.length} บิล ?`))return;
    const r=await act('cutRound',{who:cutWho,cutDate,ids,payee:payee||buyers()[0]},r=>'สร้างรอบ '+r.id+' · ใบสำคัญจ่าย '+r.pcv+' · '+m(r.amt)+' บาท');if(r){ex.clear();tab='rounds';render()}return}
  if(ds.paid){const id=ds.paid;return act('payRound',{id,paidDate:$('#pd-'+id).value,ref:$('#pr-'+id).value},id+' จ่ายแล้ว')}
  if(ds.pv)return printVoucher(ds.pv);
  if(ds.grp)return printGR(ds.grp);
  if(ds.cancelr){if(!confirm('ยกเลิกรอบ '+ds.cancelr+' ? บิลจะกลับไปรอตัดยอด (เลขใบสำคัญจ่ายของรอบนี้จะไม่ถูกใช้ซ้ำ)'))return;return act('cancelRound',{id:ds.cancelr},ds.cancelr+' ยกเลิกแล้ว')}
  if(ds.round){e.preventDefault();tab='all';f.q=ds.round;f.st='';f.cat='';render();return}
  if(t.id==='gIn'){const ids=[...gsel];gsel.clear();return act('goodsArrived',{ids,date:$('#gdate').value,br:$('#gbr').value},r=>'ของถึงแล้ว '+r.n+' รายการ · ออก '+(r.grs.join(', ')||'-')+' (กด 🖨 ใบรับสินค้า ด้านล่าง)')}
  if(ds.gundo)return act('goodsArrived',{ids:[ds.gundo],undo:true},'เปลี่ยนเป็น รอของ');
  const op=t.closest&&t.closest('[data-open]');if(op)drawer(op.dataset.open);
});
