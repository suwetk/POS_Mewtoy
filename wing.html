<style>
:root{
  --win:#05060c; --edge:#f4f4f0; --ink:#f4f4f0; --dim:#9aa0b4; --gold:#ffd84a; --hp:#7cf08a; --mp:#6fb7ff;
  --sky1:#0b1033; --sky2:#1b1f5a; --sky3:#3a2a6a; --hill:#0a0d22;
  --pix:"DotGothic16","Chakra Petch",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;color:var(--ink);font-family:var(--pix);font-size:17px;letter-spacing:.02em;
  background:var(--sky1);
  background-image:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);
  background-attachment:fixed;-webkit-font-smoothing:none;
}
a{color:inherit;text-decoration:none}

/* ---- night scene ---- */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;animation:tw 3s steps(2) infinite}
@keyframes tw{50%{opacity:.25}}
.moon{position:absolute;top:9%;left:52%;width:56px;height:56px;border-radius:50%;background:#fff6c8;
  box-shadow:0 0 0 6px rgba(255,246,200,.08),0 0 40px rgba(255,246,200,.35)}
.moon::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#e9dc9e;top:16px;left:14px;
  box-shadow:18px 14px 0 -3px #e9dc9e}
.land{position:absolute;left:0;right:0;bottom:0;width:100%;height:38vh;min-height:220px}

/* ---- layout ---- */
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 16px 190px}

/* ---- the classic window ---- */
.win{
  position:relative;background:var(--win);
  border:4px solid var(--edge);border-radius:10px;
  box-shadow:0 0 0 3px var(--win),0 0 0 4px rgba(255,255,255,.12),0 10px 0 0 rgba(0,0,0,.35);
  padding:16px 18px 14px;
}
.win::before{ /* inner hairline */
  content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.18);border-radius:5px;pointer-events:none
}
.win .lbl{ /* title sitting on the top border */
  position:absolute;top:-14px;left:18px;background:var(--win);padding:0 8px;font-size:15px;color:var(--ink);
  font-family:"Chakra Petch",var(--pix);font-weight:600;letter-spacing:.04em;line-height:22px
}

/* top bar */
.top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:stretch;margin-bottom:34px}
.title{display:flex;align-items:center;gap:16px}
.crest{width:96px;height:96px;flex:none;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45));animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.win.msg{padding-left:176px}
.hero{position:absolute;left:6px;bottom:4px;width:160px;pointer-events:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));animation:float 3s ease-in-out infinite}
.title h1{margin:0;font-size:34px;line-height:1;color:var(--gold);text-shadow:3px 3px 0 #6b3b00;letter-spacing:.06em}
.title p{margin:6px 0 0;color:var(--dim);font-size:15px;font-family:"Chakra Petch",var(--pix)}
.status{min-width:250px;font-size:16px;padding-top:20px}
.status .row{display:flex;justify-content:space-between;gap:18px;line-height:1.75}
.status .k{color:var(--dim)}
.status .clock{font-size:22px;color:var(--gold)}
.bar{height:6px;background:#22263a;margin:2px 0 4px;border:1px solid #444a66}
.bar i{display:block;height:100%;background:var(--hp)}

/* command windows */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:34px 22px;align-items:start}
.cmd{padding-top:22px}
.cmd ul{list-style:none;margin:0;padding:0}
.cmd li a{
  display:grid;grid-template-columns:22px 1fr auto;align-items:baseline;gap:4px;
  padding:7px 6px 7px 0;border-radius:4px;outline:none
}
.cur{color:var(--ink);visibility:hidden;font-size:14px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cmd li a.on .cur{visibility:visible}
.cmd li a.on .nm{color:var(--gold)}
.nm{font-family:"Chakra Petch",var(--pix);font-weight:600;font-size:18px}
.fn{display:block;color:var(--dim);font-size:13px;margin-top:1px}
.no{color:var(--dim);font-size:13px}
.ext{color:var(--mp);font-size:12px;margin-left:6px}

/* message window */
.msg{
  position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:16px;
  width:min(1068px,calc(100% - 32px));min-height:118px;padding:18px 22px 16px;
  font-family:"Chakra Petch",var(--pix);font-size:19px;line-height:1.6
}
.msg .who{color:var(--gold);margin-right:6px}
.msg .more{position:absolute;right:18px;bottom:10px;font-size:14px;animation:bob .7s steps(1) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.msg .keys{display:block;margin-top:6px;color:var(--dim);font-size:13px;font-family:var(--pix)}

/* toggles */
.tools{display:flex;gap:10px;justify-content:flex-end;margin:-18px 0 26px}
.btn{font:inherit;font-size:14px;color:var(--ink);background:var(--win);border:3px solid var(--edge);border-radius:7px;
  padding:5px 12px;cursor:pointer}
.btn:hover{color:var(--gold)}

@media (max-width:640px){
  body{font-size:15px}
  .top{grid-template-columns:1fr;gap:28px}
  .title h1{font-size:26px}
  .crest{width:72px;height:72px}
  .status{min-width:0}
  .grid{grid-template-columns:1fr}
  .wrap{padding-bottom:170px}
  .msg{font-size:16px;min-height:96px;bottom:10px;width:calc(100% - 20px)}
  .msg .keys{display:none}
  .win.msg{padding-left:108px}
  .hero{width:100px;left:2px}
  .moon{display:none}
  .status{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;padding-top:18px}
  .status .bar{grid-column:1/-1}
  .no{display:none}
  .tools{margin-top:0}
}
@media (prefers-reduced-motion:reduce){ .star,.cur,.msg .more,.crest,.hero{animation:none} }
</style>
</head>

function say(text, who){
  clearInterval(typeTimer);
  const head = who ? `<span class="who">${esc(who)}:</span>` : "";
  const chars = [...text]; let n = 0;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ msgEl.innerHTML = head + esc(text); return; }
  msgEl.innerHTML = head;
  typeTimer = setInterval(() => {
    n += 2; msgEl.innerHTML = head + esc(chars.slice(0,n).join(""));
    if (n >= chars.length) clearInterval(typeTimer);
  }, 22);
}

/* sound (off by default) */
let soundOn = store.get("mq_sound", false), ac = null;
const sndBtn = document.getElementById("snd");
const paintSnd = () => sndBtn.textContent = "♪ เสียง: " + (soundOn ? "เปิด" : "ปิด");
paintSnd();
sndBtn.onclick = () => { soundOn = !soundOn; store.set("mq_sound", soundOn); paintSnd(); beep(880,.05); };
function beep(f, d){
  if (!soundOn) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square"; o.frequency.value = f; g.gain.value = .04;
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  }catch(e){}
}

/* cursor */
let sel = -1;
function select(i, quiet){
  if (i < 0 || i >= links.length) return;
  if (sel >= 0) links[sel].classList.remove("on");
  sel = i; links[i].classList.add("on");
  if (!quiet){ beep(660,.035); }
  const it = flat[i];
  say(`「${it.name}」 — ${it.desc}`);
}
function go(i){
  const it = flat[i]; if (!it) return;
  beep(990,.08);
  const exp = store.get("mq_exp",0) + 1; store.set("mq_exp", exp);
  say(`ท่านออกเดินทางไปยัง ${it.name}…`);
  setTimeout(() => { if (it.newTab) window.open(it.url,"_blank","noopener"); else location.href = it.url; }, soundOn ? 220 : 60);
}

links.forEach((a,i) => {
  a.addEventListener("mouseenter", () => { if (sel !== i) select(i); });
  a.addEventListener("focus", () => { if (sel !== i) select(i); });
  a.addEventListener("click", e => {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
    e.preventDefault(); go(i);
  });
});

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === "ArrowDown"){ e.preventDefault(); select(sel < 0 ? 0 : (sel + 1) % links.length); }
  else if (k === "ArrowUp"){ e.preventDefault(); select(sel <= 0 ? links.length - 1 : sel - 1); }
  else if (k === "ArrowRight" || k === "ArrowLeft"){
    e.preventDefault();
    const g = sel < 0 ? -1 : flat[sel].g;
    const ng = k === "ArrowRight" ? (g + 1) % GROUPS.length : (g <= 0 ? GROUPS.length - 1 : g - 1);
    select(flat.findIndex(x => x.g === ng));
  }
  else if (k === "Enter" && sel >= 0 && document.activeElement === document.body){ e.preventDefault(); go(sel); }
  else if (/^[1-9]$/.test(k)){ const i = +k - 1; if (flat[i]){ select(i, true); go(i); } }
  else if (k === "Escape"){ if (sel >= 0) links[sel].classList.remove("on"); sel = -1; say(GREET, "ผู้กล้า"); }
});

/* status window: clock, day, HP = time left in the work day (10:00–20:00) */
function tick(){
  const now = new Date();
  document.getElementById("clk").textContent = now.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("day").textContent = now.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"});
  const h = now.getHours() + now.getMinutes()/60;
  const left = Math.max(0, Math.min(1, (20 - h) / 10));
  const hp = Math.round(left * 999);
  document.getElementById("hpTxt").textContent = hp + "/999";
  const bar = document.getElementById("hp");
  bar.style.width = (left*100) + "%";
  bar.style.background = left > .5 ? "var(--hp)" : left > .2 ? "var(--gold)" : "#ff6b5f";
  document.getElementById("exp").textContent = store.get("mq_exp",0);
}
tick(); setInterval(tick, 20000);

/* stars */
(function(){
  const sc = document.getElementById("scene"); let html = "";
  for (let i = 0; i < 70; i++){
    const x = Math.random()*100, y = Math.random()*55, s = Math.random() < .15 ? 3 : 2;
    html += `<i class="star" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-delay:${(Math.random()*3).toFixed(2)}s"></i>`;
  }
  sc.insertAdjacentHTML("afterbegin", html);
})();

document.getElementById("heroBig").src = document.querySelector(".crest").src;
say(GREET, "ผู้กล้า");
