<style>

<script>
// ---------- utils ----------
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
function apiUrl() { return (ls(URL_KEY) || "").trim() || API_URL_DEFAULT; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function jsq(s) { return esc(JSON.stringify(String(s == null ? "" : s))); }
function n0(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function isBlank(v) { return v === "" || v === null || v === undefined; }
function fmt(n) { return Number(n || 0).toLocaleString("th-TH", { maximumFractionDigits: 2 }); }
function fmt2(n) { return Number(n || 0).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function money(n) { return "฿" + fmt2(n); }
function r2(x) { return Math.round(n0(x) * 100) / 100; }
function fmtDate(s) { if (!s) return ""; const p = String(s).slice(0, 10).split("-"); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function todayStr() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); }
function daysTo(dateStr) { if (!dateStr) return null; const d = new Date(String(dateStr).slice(0, 10) + "T00:00:00+07:00"); const t = new Date(todayStr() + "T00:00:00+07:00"); return Math.round((d - t) / 86400e3); }
function chip(s) { return `<span class="chip ${STATUS_COLOR[s] || "bg-gray-100 text-gray-600"}">${esc(s)}</span>`; }
function safeFile(s) { return String(s || "").replace(/[\\/:*?"<>|]+/g, "_").trim(); }
let toastTimer;
function toast(msg, isErr) {
  const t = document.getElementById("toast"); t.textContent = msg;
  t.className = "fixed bottom-5 left-1/2 -translate-x-1/2 text-white text-sm px-4 py-2.5 rounded-full shadow-lg z-[200] max-w-[90%] text-center " + (isErr ? "bg-red-600" : "bg-gray-900");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), isErr ? 6000 : 2600);
}
let busyN = 0; function busy(on) { busyN += on ? 1 : -1; document.getElementById("busy").classList.toggle("hidden", busyN <= 0); }
async function api(action, payload) {
  const url = apiUrl(); if (!url) throw new Error("ยังไม่ได้ตั้ง URL เซิร์ฟเวอร์ — กด ⚙️");
  busy(true);
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ action, pin: S.pin }, payload || {})) });
    const r = await res.json();
    if (!r || r.status !== "success") throw new Error((r && r.message) || "เซิร์ฟเวอร์ตอบผิดพลาด");
    return r.data;
  } finally { busy(false); }
}
async function run(fn) { try { return await fn(); } catch (e) { console.error(e); toast(e.message || String(e), true); } }
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("คัดลอกแล้ว — วางใน LINE ได้เลย"); }
  catch (e) { openModal(`<h3 class="font-bold mb-2">คัดลอกข้อความ</h3><textarea class="w-full h-72 border rounded-lg p-2 text-sm" readonly>${esc(text)}</textarea><div class="text-right mt-2"><button class="btn btn-w" onclick="closeModal()">ปิด</button></div>`); }
}
function openModal(html) { document.getElementById("modalBody").innerHTML = html; document.getElementById("modal").classList.remove("hidden"); }
function closeModal() { document.getElementById("modal").classList.add("hidden"); }
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
function openUrlSetting() {
  openModal(`<h3 class="font-bold mb-2">⚙️ URL เซิร์ฟเวอร์ (Apps Script)</h3>
    <p class="text-xs text-gray-500 mb-2">คัดลอกจาก Apps Script &gt; Deploy &gt; Manage deployments (ลงท้าย /exec)</p>
    <input id="urlInput" class="w-full border rounded-lg px-3 py-2 text-sm" value="${esc(apiUrl())}">
    <div class="flex justify-end gap-2 mt-3"><button class="btn btn-w" onclick="closeModal()">ปิด</button>
    <button class="btn btn-p" onclick="ls('${URL_KEY}', document.getElementById('urlInput').value.trim()); closeModal(); toast('บันทึก URL แล้ว')">บันทึก</button></div>`);
}
function wireDrop(id, cb) {
  const el = document.getElementById(id); if (!el) return;
  ["dragenter", "dragover"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.add("drag"); }));
  ["dragleave", "drop"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.remove("drag"); }));
  el.addEventListener("drop", e => { if (e.dataTransfer.files.length) cb(e.dataTransfer.files); });
}
function pickFiles(accept, multiple, cb) {
  // ต้องแปะ input ไว้ในหน้า (ซ่อน) — บางเบราว์เซอร์/iPad ไม่ส่ง change ให้ input ที่ไม่ได้อยู่ในหน้า
  const i = document.createElement("input"); i.type = "file"; i.accept = accept; i.multiple = !!multiple; i.style.display = "none";
  i.onchange = () => { const f = Array.from(i.files || []); i.remove(); if (f.length) cb(f); };
  document.body.appendChild(i); i.click();
}

<script>
// ===== อ่านไฟล์ Excel (สำเนาจาก PM — แยกไฟล์กันเพื่อไม่ให้ระบบหนึ่งพังแล้วพาอีกระบบพัง) =====
async function readBook(file) { const buf = await file.arrayBuffer(); return { buf, wb: XLSX.read(buf, { type: "array" }) }; }
function gridOf(ws, maxRows) {
  if (!ws || !ws["!ref"]) return [];
  const r = XLSX.utils.decode_range(ws["!ref"]), out = [];
  for (let R = 0; R <= Math.min(r.e.r, (maxRows || 20000) - 1); R++) {
    const row = [];
    for (let C = 0; C <= Math.min(r.e.c, 60); C++) { const c = ws[XLSX.utils.encode_cell({ r: R, c: C })]; row[C] = c ? c.v : null; }
    out.push(row);
  }
  return out;
}
function normBarcode(v) {
  if (v === null || v === undefined || v === "") return "";
  if (typeof v === "number") return v > 0 && Number.isFinite(v) ? String(Math.round(v)) : "";
  const s = String(v).trim().replace(/^'+/, "");
  if (/^[\d\s\-]+$/.test(s)) return s.replace(/\D/g, "");
  if (/^\d+(\.\d+)?e\+\d+$/i.test(s)) return String(Math.round(Number(s)));
  return "";
}
function toQty(v) { if (typeof v === "number") return v; const s = String(v == null ? "" : v).replace(/[, ]/g, ""); return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : 0; }
function hdr(v) { return String(v == null ? "" : v).replace(/\s+/g, " ").trim(); }
function itemKeyOf(barcode, name) { const b = String(barcode || "").replace(/\D/g, ""); return b.length >= 6 ? b : "N:" + String(name || "").toUpperCase().replace(/\s+/g, " ").trim(); }
function colName(i) { return XLSX.utils.encode_col(i); }
const RX = {
  barcode: [/full\s*jan/i, /barcode|บาร์โค้ด/i, /jan|ean/i],
  oldBarcode: [/old\s*full\s*jan/i, /old\s*barcode/i],
  name: [/item\s*name/i, /description/i, /ชื่อสินค้า|รายการสินค้า/, /product/i, /^name$/i],
  itemCode: [/^item\s*(no\.?|code)$/i],
  series: [/^series/i], month: [/^month$/i], yen: [/retail.*jpy|yen|jpy/i],
  pcsCtn: [/pcs\.?\s*\/?\s*c(ar)?t(o)?n|qty\s*\/\s*ctn|ชิ้น\s*\/\s*ลัง/i],
  price1: [/price\s*1|p1\s*thb/i], price2: [/price\s*2|p2\s*thb/i],
  remark: [/^remarks?$/i], isNew: [/^new\s*item$/i], offer: [/^offer$/i], type: [/^type$/i],
  qty: [/order\s*\(\s*pcs\s*\)/i, /mew\s*toy\s*order/i, /order\s*qty|qty\s*order/i, /confirm/i, /^qty$|^จำนวน$/i, /จำนวน|สั่ง/, /qty/i, /^order$/i]
};
const NOT_QTY = /ctn|carton|ลัง|amt|amount|ยอดเงิน|price|ราคา|total|retail/i;
function findHeaderRow(grid) {
  const all = [].concat(RX.barcode, RX.name, RX.pcsCtn, RX.price1, RX.price2, RX.qty.slice(0, 4), RX.itemCode, RX.offer);
  let best = -1, bs = 0;
  for (let r = 0; r < Math.min(grid.length, 40); r++) {
    let s = 0; (grid[r] || []).forEach(v => { const t = hdr(v); if (t && t.length < 60 && all.some(x => x.test(t))) s++; });
    if (s > bs) { bs = s; best = r; }
  }
  return bs >= 2 ? best : -1;
}
function findCol(grid, hr, list, exclude, notCols) {
  if (hr < 0) return -1; const row = grid[hr] || [];
  for (const rx of list) for (let c = 0; c < row.length; c++) {
    const t = hdr(row[c]); if (!t || (notCols && notCols.includes(c)) || (exclude && exclude.test(t))) continue;
    if (rx.test(t)) return c;
  }
  return -1;
}
function findBarcodeCol(grid, start, keySet) {
  const sc = [];
  for (let r = Math.max(0, start); r < grid.length; r++) (grid[r] || []).forEach((v, c) => {
    const b = normBarcode(v); if (!b) return;
    if (keySet) { if (keySet.has(b)) sc[c] = (sc[c] || 0) + 1; }
    else if (b.length >= 8 && b.length <= 14) sc[c] = (sc[c] || 0) + (b.length === 13 ? 2 : 1);
  });
  let best = -1, bs = 0; sc.forEach((s, c) => { if (s > bs) { bs = s; best = c; } }); return best;
}
/** วิเคราะห์ชีต → map คอลัมน์ (ใช้ได้ทั้ง Offer / ไฟล์ WS / บิลสินค้าเข้า / List of Stock) */
function detectMap(grid, keySet) {
  const hr = findHeaderRow(grid);
  const m = { headerRow: Math.max(hr, 0) };
  m.barcode = findBarcodeCol(grid, hr + 1, keySet);
  if (m.barcode < 0) m.barcode = findCol(grid, hr, RX.barcode, /old/i);
  m.oldBarcode = findCol(grid, hr, RX.oldBarcode, null, [m.barcode]);
  m.name = findCol(grid, hr, RX.name, /old|series/i, [m.barcode]);
  if (m.name < 0) {   // ไม่มีหัว → คอลัมน์ข้อความยาวที่เยอะสุด
    const sc = []; for (let r = hr + 1; r < Math.min(grid.length, hr + 300); r++) (grid[r] || []).forEach((v, c) => { if (c !== m.barcode && typeof v === "string" && v.trim().length >= 6 && !normBarcode(v)) sc[c] = (sc[c] || 0) + 1; });
    let b = -1, bs = 0; sc.forEach((s, c) => { if (s > bs) { bs = s; b = c; } }); m.name = b;
  }
  m.itemCode = findCol(grid, hr, RX.itemCode, /old/i); m.series = findCol(grid, hr, RX.series); m.month = findCol(grid, hr, RX.month);
  m.yen = findCol(grid, hr, RX.yen); m.pcsCtn = findCol(grid, hr, RX.pcsCtn); m.price1 = findCol(grid, hr, RX.price1); m.price2 = findCol(grid, hr, RX.price2);
  m.remark = findCol(grid, hr, RX.remark); m.isNew = findCol(grid, hr, RX.isNew); m.offer = findCol(grid, hr, RX.offer); m.type = findCol(grid, hr, RX.type);
  m.qty = findCol(grid, hr, RX.qty, NOT_QTY, [m.barcode, m.name, m.pcsCtn]);
  if (hr < 0) { m.headerRow = 0; if (m.barcode < 0) m.barcode = 1; if (m.name < 0) m.name = 2; if (m.qty < 0) m.qty = 4; }
  return m;
}
function pickSheet(wb, keySet, prefer) {
  if (prefer) { const s = wb.SheetNames.find(n => n.trim() === prefer); if (s) return s; }
  let best = wb.SheetNames[0], bs = -1;
  wb.SheetNames.forEach(n => {
    let cnt = 0; gridOf(wb.Sheets[n], 3000).forEach(r => (r || []).forEach(v => { const b = normBarcode(v); if (b && (keySet ? keySet.has(b) : b.length >= 12 && b.length <= 14)) cnt++; }));
    if (cnt > bs) { bs = cnt; best = n; }
  });
  return best;
}
function extract(grid, m) {
  const out = [], g = (row, c) => c >= 0 ? row[c] : null;
  for (let r = m.headerRow + 1; r < grid.length; r++) {
    const row = grid[r] || [];
    const barcode = normBarcode(g(row, m.barcode)), name = hdr(g(row, m.name));
    if (!barcode && !name) continue;
    if (!barcode && /^(grand\s*)?total|^รวม|^ยอดรวม|^-$/i.test(name)) continue;
    out.push({
      r, barcode, name, oldBarcode: normBarcode(g(row, m.oldBarcode)), itemCode: hdr(g(row, m.itemCode)), series: hdr(g(row, m.series)),
      month: hdr(g(row, m.month)), yen: toQty(g(row, m.yen)) || "", pcsCtn: toQty(g(row, m.pcsCtn)) || "", price1: toQty(g(row, m.price1)) || "",
      price2: toQty(g(row, m.price2)) || "", remark: hdr(g(row, m.remark)), isNew: /new/i.test(hdr(g(row, m.isNew))),
      offer: hdr(g(row, m.offer)), cut: /cut/i.test(hdr(g(row, m.type))), qty: m.qty >= 0 ? toQty(g(row, m.qty)) : 0,
      qtyBlank: m.qty < 0 || g(row, m.qty) === null || g(row, m.qty) === ""
    });
  }
  return out;
}
function colOptions(grid, m, sel, allowNone) {
  const hr = grid[m.headerRow] || [];
  const width = Math.max(hr.length, ...(grid.slice(m.headerRow, m.headerRow + 30).map(r => (r || []).length)), 1);
  let h = allowNone !== false ? `<option value="-1" ${sel < 0 ? "selected" : ""}>— ไม่มี —</option>` : "";
  for (let c = 0; c < width; c++) { const t = hdr(hr[c]); h += `<option value="${c}" ${c === sel ? "selected" : ""}>${colName(c)}${t ? " · " + esc(t.slice(0, 26)) : ""}</option>`; }
  return h;
}
const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
/** หา Closing date ในไฟล์ เช่น "Closing date: September 16, 2026 (Wed) 12:00 JST" / "(ปิดรับ 19/4/26 22.00)" / "(CLOSING 19-4-2026)" */
function findCloseDate(grid, fileName) {
  const texts = []; grid.slice(0, 12).forEach(r => (r || []).forEach(v => { if (typeof v === "string") texts.push(v); }));
  texts.push(fileName || "");
  for (const t of texts) {
    let m = /clos\w*\s*(?:date)?\s*:?\s*([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/i.exec(t);

// ---------- จับคู่: หาว่าบาร์โค้ดยุคเก่าตัวไหนน่าจะเป็นสินค้าเดียวกับยุคใหม่ ----------
const STOP = new Set(["THE", "OF", "AND", "GUNDAM", "VER", "MOBILE", "SUIT", "KIT", "MODEL", "PLASTIC", "BANDAI", "SPIRITS", "NEW", "P", "PB", "PBANDAI", "PREMIUM",

function normName(n) {

const CIRCLED = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
const TOKC = new Map();

let IDF = null;   // คำที่เจอบ่อย (FIGUARTS, OPTION, PARTS…) มีน้ำหนักน้อย
function wt(t) { return IDF ? (IDF.get(t) || IDF.max) : 1; }
function gradeOf(name) {
  const u = " " + String(name || "").toUpperCase().replace(/1\s*\/\s*\d{2,4}/g, " ").replace(/([A-Z])(\d)/g, "$1 $2").replace(/(\d)([A-Z])/g, "$1 $2").replace(/[^A-Z0-9\/]+/g, " ") + " ";

    ["RE/100", "RE/100"], ["RE 100", "RE/100"], ["FULL MECHANICS", "FM"], ["SDCS", "SD"], ["SDW", "SD"], ["BB", "SD"], ["SD", "SD"], ["EG", "EG"], ["ENTRY GRADE", "EG"], ["30 MM", "30MM"], ["30 MS", "30MS"], ["FIGURE RISE", "FRS"]];

function computePairs() {

  IDF = new Map(); const N = act.length || 1; df.forEach((c, t) => IDF.set(t, Math.log(1 + N / c))); IDF.max = Math.log(1 + N);
  act.forEach(p => p.bcs.forEach(bc => { const e = eraOf(bc); if (!e) return; const f = (fam[p.id] = fam[p.id] || {}); const x = (f[e.brand] = f[e.brand] || { min: 99, max: 0 }); x.min = Math.min(x.min, e.order); x.max = Math.max(x.max, e.order); }));

async function mergeInto() {

function pairPayload(oldId, newId, score, method) {

async function mergeSelected() {

  if (!rows.length) return;

    const r = await api("merge", { pairs });
    pairs.forEach(p => localMerge(p.keep, p.drop));

}

async function notSame(oldId, ids) {

    delete S.sel[oldId]; refreshPairs(); renderPairs(document.getElementById("view")); toast("บันทึกว่าไม่ใช่แล้ว");

}

        <label id="impDrop" class="drop" onclick="pickFiles('.xlsx,.xlsm,.xls', true, fs => run(() => impFiles(fs)))"><i class="fa-solid fa-file-excel text-2xl text-green-600"></i><div class="text-sm mt-1">ลากไฟล์มาวาง หรือกดเลือก</div></label>
        <ul class="text-xs muted mt-2 list-disc ml-5"><li>ช่อง OLD FULL JAN / OLD BARCODE → เชื่อมบาร์โค้ดเก่า-ใหม่ให้เอง (ชัวร์ 100%)</li><li>ราคา P1 / P2 / เยน เก็บเป็นประวัติ เพิ่มแถวเมื่อราคาเปลี่ยน</li><li>สินค้าที่ยังไม่มี → สร้างใหม่ · ชื่อที่ต่าง → เก็บเป็นชื่ออื่น</li></ul></div>
      <div class="card"><h3 class="font-bold mb-1">Product_ID (POS)</h3><p class="text-sm muted mb-2">อ่านอย่างเดียว — ดึงซ้ำได้เรื่อยๆ เวลามีคนเพิ่ม/แก้ใน Product_ID</p>
        <button class="btn btn-w" onclick="syncPid()"><i class="fa-solid fa-cloud-arrow-down"></i> ดึงจาก Product_ID</button></div>
    </div>
    ${sourcesTable()}`;
  wireDrop("impDrop", fs => run(() => impFiles(Array.from(fs))));
}
function dateFromName(name) {
  const m = /(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{4})/i.exec(name);
  if (m) return `${m[3]}-${String(MONTHS[m[2].toLowerCase()]).padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  const d = /(20\d\d)[\-.](\d{1,2})[\-.](\d{1,2})/.exec(name); if (d) return `${d[1]}-${d[2].padStart(2, "0")}-${d[3].padStart(2, "0")}`;
  return "";
}
function hashOf(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return "h" + (h >>> 0).toString(36) + "-" + s.length; }
async function impFiles(files) {
  const out = [];
  for (const file of files) {
    const { wb } = await readBook(file), sheet = pickSheet(wb), grid = gridOf(wb.Sheets[sheet]), map = detectMap(grid);
    const rows = extract(grid, map).filter(r => r.barcode && r.barcode.length >= 8).map(r => ({ barcode: r.barcode, oldBarcode: r.oldBarcode, itemCode: r.itemCode, name: r.name, series: r.series, yen: r.yen, pcsCtn: r.pcsCtn, price1: r.price1, price2: r.price2 }));
    const type = /list\s*(of\s*)?stock/i.test(file.name) ? "List of Stock" : /offer/i.test(file.name + " " + findTitle(grid, file.name)) ? "Offer" : /confirm|รายการสินค้าเข้า|bill|บิล/i.test(file.name) ? "บิล" : "อื่นๆ";
    out.push({ file, sheet, rows, type, supplier: "Dreamtoy", date: findCloseDate(grid, file.name) || dateFromName(file.name), old: rows.filter(r => r.oldBarcode).length, priced: rows.filter(r => r.price2 || r.price1).length,
      hash: hashOf(sheet + JSON.stringify(rows.map(r => [r.barcode, r.oldBarcode, r.price1, r.price2, r.yen]))) });
  }
  S.imp = out; drawImp();
}
function drawImp() {
  openModal(`<h3 class="font-bold mb-2">นำเข้าไฟล์ซัพ ${S.imp.length} ไฟล์</h3>
    <div class="overflow-auto"><table class="g"><thead><tr><th>ไฟล์</th><th class="num">รายการ</th><th class="num">มี OLD JAN</th><th class="num">มีราคา</th><th>ประเภท</th><th>ซัพ</th><th>วันที่ไฟล์ *</th></tr></thead><tbody>
    ${S.imp.map((f, i) => `<tr><td class="text-xs" style="max-width:260px">${esc(f.file.name)}<div class="muted">แท็บ ${esc(f.sheet)}</div></td><td class="num">${fmt(f.rows.length)}</td><td class="num">${fmt(f.old)}</td><td class="num">${fmt(f.priced)}</td>
      <td><select class="sel" onchange="S.imp[${i}].type=this.value">${["Offer", "บิล", "List of Stock", "อื่นๆ"].map(t => `<option ${t === f.type ? "selected" : ""}>${t}</option>`).join("")}</select></td>
      <td><input class="inp" style="width:100px" value="${esc(f.supplier)}" oninput="S.imp[${i}].supplier=this.value"></td>
      <td><input type="date" class="inp ${f.date ? "" : "border-red-400"}" value="${esc(f.date)}" oninput="S.imp[${i}].date=this.value"></td></tr>`).join("")}
    </tbody></table></div>
    <p class="text-xs muted mt-2">วันที่ไฟล์ใช้เรียงประวัติราคา — Offer ใช้ Closing date, บิลใช้วันที่ในชื่อไฟล์ ถ้าไม่เจอให้ใส่เอง (ไฟล์เก่าประมาณเดือนก็ได้)</p>
    <div id="impRes" class="text-sm mt-2"></div>
    <div class="flex justify-end gap-2 mt-3"><button class="btn btn-w" onclick="closeModal()">ปิด</button><button class="btn btn-p" id="impBtn" onclick="doImp()">นำเข้า (เรียงเก่า → ใหม่)</button></div>`);
}
async function doImp() {
  const bad = S.imp.filter(f => !f.date); if (bad.length) return toast("ใส่วันที่ไฟล์ให้ครบก่อน", true);
  const list = S.imp.slice().sort((a, b) => a.date.localeCompare(b.date)), res = document.getElementById("impRes");
  document.getElementById("impBtn").disabled = true;
  const lines = [];
  for (const f of list) {
    try {
      const r = await api("importSupplier", { supplier: f.supplier, type: f.type, fileName: f.file.name, fileDate: f.date, hash: f.hash, rows: f.rows });
      lines.push(`<div class="text-green-700">✓ ${esc(f.file.name)} — ${esc(r.summary)}</div>`);
    } catch (e) { lines.push(`<div class="text-red-600">✗ ${esc(f.file.name)} — ${esc(e.message)}</div>`); }
    res.innerHTML = lines.join("");
  }
  await loadAll(); renderNav(); if (S.page === "import") renderImport(document.getElementById("view"));
  toast("นำเข้าเสร็จ");
}

function renderSettings(v) {
  const A = isAdmin();
  S.setRules = (S.all.rules || []).map(r => Object.assign({}, r));
  S.setRoles = (S.all.roles || []).map(r => Object.assign({}, r));
  v.innerHTML = `<div class="grid lg:grid-cols-2 gap-3">
    <div class="card"><h3 class="font-bold mb-1">ยุคบาร์โค้ด</h3><p class="text-xs muted mb-2">เลขขึ้นต้น → ยี่ห้อ + ยุค · ลำดับ 1 = เก่าสุด · ระบบเสนอคู่จากยุคเก่าไปยุคใหม่ของยี่ห้อเดียวกัน · ยี่ห้ออื่นที่เปลี่ยนบาร์โค้ดเพิ่มได้เลย</p>
      <div id="ruleBox"></div>${A ? `<div class="flex gap-2 mt-2"><button class="btn btn-w" onclick="S.setRules.push({prefix:'',brand:'',era:'',order:1,note:''}); drawRules()"><i class="fa-solid fa-plus"></i> เพิ่ม</button><button class="btn btn-p" onclick="saveRules()">บันทึก</button></div>` : ""}</div>
    <div class="card"><h3 class="font-bold mb-1">สิทธิ์ผู้ใช้ PD</h3><p class="text-xs muted mb-2">PIN ใช้ของ POS · Master = Admin อัตโนมัติ · Office = นำเข้า/จับคู่/แก้สินค้าได้</p>
      <div id="roleBox"></div>${A ? `<div class="flex gap-2 mt-2"><button class="btn btn-w" onclick="S.setRoles.push({name:'',role:'Office'}); drawRoles()"><i class="fa-solid fa-plus"></i> เพิ่ม</button><button class="btn btn-p" onclick="saveRoles()">บันทึก</button></div>` : ""}
      <p class="text-xs muted mt-3">เวอร์ชันเซิร์ฟเวอร์ ${esc(S.all.version)}</p></div></div>`;
  drawRules(); drawRoles();
}
function drawRules() {
  const A = isAdmin();
  document.getElementById("ruleBox").innerHTML = `<table class="g"><thead><tr><th>ขึ้นต้น</th><th>ยี่ห้อ</th><th>ชื่อยุค</th><th>ลำดับ</th><th>หมายเหตุ</th><th></th></tr></thead><tbody>
    ${S.setRules.map((r, i) => `<tr>${["prefix", "brand", "era", "order", "note"].map(k => `<td><input class="inp" style="width:${k === "order" ? 50 : k === "note" ? 150 : 100}px" value="${esc(r[k])}" ${A ? "" : "disabled"} oninput="S.setRules[${i}].${k}=this.value"></td>`).join("")}
      <td>${A ? `<button class="btn btn-d btn-s" onclick="S.setRules.splice(${i},1); drawRules()"><i class="fa-solid fa-xmark"></i></button>` : ""}</td></tr>`).join("")}</tbody></table>`;
}
function drawRoles() {
  const A = isAdmin();
  document.getElementById("roleBox").innerHTML = S.setRoles.map((r, i) => `<div class="flex gap-2 mb-2"><input class="inp flex-1" placeholder="ชื่อ (ตรงกับ Staff)" value="${esc(r.name)}" ${A ? "" : "disabled"} oninput="S.setRoles[${i}].name=this.value">
    <select class="sel" ${A ? "" : "disabled"} onchange="S.setRoles[${i}].role=this.value">${["Admin", "Office"].map(x => `<option ${x === r.role ? "selected" : ""}>${x}</option>`).join("")}</select>
    ${A ? `<button class="btn btn-d btn-s" onclick="S.setRoles.splice(${i},1); drawRoles()"><i class="fa-solid fa-xmark"></i></button>` : ""}</div>`).join("") || `<p class="text-sm muted">ยังไม่มี</p>`;
}
async function saveRules() { await run(async () => { S.all.rules = await api("saveEraRules", { rules: S.setRules }); await loadAll(); renderNav(); toast("บันทึกยุคบาร์โค้ดแล้ว"); renderSettings(document.getElementById("view")); }); }
async function saveRoles() { await run(async () => { S.all.roles = await api("saveRoles", { roles: S.setRoles }); toast("บันทึกสิทธิ์แล้ว"); }); }

(async () => {
  if (!apiUrl()) { openUrlSetting(); return; }
  const saved = ss(PIN_KEY) || "";
  try { await login(saved); } catch (e) { ss(PIN_KEY, null); if (saved) { try { await login(""); } catch (e2) {} } }
