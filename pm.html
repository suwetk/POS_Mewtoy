<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM — Product Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif; background:#f3f4f6; margin:0; color:#111827; }
  * { box-sizing:border-box; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; white-space:nowrap; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:600; padding:7px 12px; border-radius:10px; border:1px solid transparent; cursor:pointer; white-space:nowrap; }
  .btn:active { transform:scale(.97); } .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-p { background:#0f766e; color:#fff; } .btn-w { background:#fff; border-color:#d1d5db; color:#374151; } .btn-d { background:#fff; border-color:#fecaca; color:#dc2626; }
  .btn-s { padding:4px 9px; font-size:12px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 1px 2px rgba(0,0,0,.06); padding:16px; }
  .nav { display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:12px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; color:#4b5563; }
  .nav.on { background:#0f766e; color:#fff; }
  .tab { padding:7px 12px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; background:#fff; border:1px solid #e5e7eb; color:#4b5563; white-space:nowrap; }
  .tab.on { background:#ccfbf1; border-color:#5eead4; color:#115e59; }
  .drop { display:block; border:2px dashed #d1d5db; border-radius:14px; padding:18px; text-align:center; cursor:pointer; transition:.15s; }
  .drop.drag { border-color:#0f766e; background:#f0fdfa; }
  table.g { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }
  table.g th { background:#f9fafb; font-weight:600; color:#4b5563; text-align:left; padding:6px 8px; border-bottom:1px solid #e5e7eb; position:sticky; top:0; z-index:2; white-space:nowrap; }
  table.g td { padding:5px 8px; border-bottom:1px solid #f3f4f6; vertical-align:middle; }
  table.g tr:hover td { background:#fafafa; }
  table.g .sl { position:sticky; left:0; background:#fff; z-index:1; } table.g th.sl { z-index:3; background:#f9fafb; }
  table.g .num { text-align:right; font-variant-numeric:tabular-nums; }
  .qin { width:62px; text-align:right; border:1px solid #d1d5db; border-radius:8px; padding:3px 6px; font-variant-numeric:tabular-nums; background:#fff; }
  .qin:focus { outline:2px solid #5eead4; border-color:#14b8a6; } .qin.dirty { background:#fef9c3; } .qin.bad { border-color:#ef4444; background:#fef2f2; }
  .scrollbox { overflow:auto; max-height:66vh; border:1px solid #e5e7eb; border-radius:12px; background:#fff; }
  .nm { min-width:220px; max-width:340px; } .muted { color:#6b7280; }
  select.sel, input.inp, textarea.inp { border:1px solid #d1d5db; border-radius:8px; padding:5px 8px; font-size:13px; background:#fff; }
  .kpi { font-size:11px; color:#6b7280; } .kpi + b { font-size:18px; }
  #printArea { display:none; }
  @media print { body > *:not(#printArea) { display:none !important; } #printArea { display:block !important; } body { background:#fff; } .pbreak { break-after:page; } }
</style>
</head>
<body>

<div id="loginView" class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-sm">
    <div class="flex items-center gap-2 mb-1"><i class="fa-solid fa-cubes text-teal-700 text-xl"></i><h1 class="text-lg font-bold">PM — Product Manager</h1></div>
    <p class="text-sm text-gray-500 mb-4">สั่งของซัพ · รับของ · แบ่งพ่อค้าส่ง · ออกบิล</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN (เดียวกับ POS)"
      class="w-full border rounded-xl px-4 py-3 text-center text-xl tracking-widest mb-3 outline-none focus:ring-2 focus:ring-teal-300">
    <button id="loginBtn" class="btn btn-p w-full py-3 text-base">เข้าสู่ระบบ</button>
    <p id="loginErr" class="text-sm text-red-600 mt-3 hidden"></p>
    <button class="text-xs text-gray-400 mt-4 underline" onclick="openUrlSetting()">⚙️ URL เซิร์ฟเวอร์</button>
  </div>
</div>

<div id="mainView" class="hidden max-w-7xl mx-auto p-3 sm:p-5">
  <header class="flex flex-wrap items-center gap-2 mb-3">
    <i class="fa-solid fa-cubes text-teal-700 text-xl"></i>
    <h1 class="text-lg font-bold mr-2">PM</h1>
    <nav id="nav" class="flex gap-1 overflow-x-auto mr-auto"></nav>
    <span id="busy" class="text-xs text-gray-400 hidden"><i class="fa-solid fa-spinner fa-spin"></i></span>
    <span class="text-sm text-gray-600"><i class="fa-regular fa-user"></i> <span id="userName"></span></span>
    <button class="btn btn-w btn-s" onclick="openUrlSetting()" title="URL เซิร์ฟเวอร์"><i class="fa-solid fa-gear"></i></button>
    <button class="btn btn-w btn-s" onclick="logout()">ออก</button>
  </header>
  <div id="view"></div>
</div>

<div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white w-full sm:max-w-3xl rounded-t-2xl sm:rounded-2xl p-5 max-h-[92vh] overflow-auto" id="modalBody"></div>
</div>
<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 text-white text-sm px-4 py-2.5 rounded-full shadow-lg z-[200] max-w-[90%] text-center"></div>
<div id="printArea"></div>

<script>
// ===================================================================
// PM — Product Manager · หน้าเว็บ static (GitHub Pages) คุยกับ pm_backend.gs
// ผ่าน fetch POST text/plain (กัน CORS preflight แบบเดียวกับ POS/Shopee)
// อ่านไฟล์ Excel ในเครื่อง (SheetJS) · เติมยอดลงไฟล์ซัพด้วยการแก้ XML (JSZip)
// ใบแจ้งหนี้ PDF (html2pdf) + Excel (SheetJS)
// ===================================================================
const API_URL_DEFAULT = "https://script.google.com/macros/s/AKfycbxjWnpgoqpx5imWnaXYMTz3FMnWSCGe5Dqp6JjaXO_Efo-OTOYBxMp03naUnHfQmjzK/exec";          // << ใส่ URL /exec ของ pm_backend.gs หรือตั้งผ่าน ⚙️
const URL_KEY = "pm_api_url", PIN_KEY = "pm_pin";
const SHOP_CODE = "SHOP", SHOP_NAME = "Mewtoy (ร้าน)";
const ROUND_STATUS = ["ร่าง", "เปิดรับ", "ส่งซัพแล้ว", "คอนเฟิร์มแล้ว", "ของทยอยเข้า", "จบ"];
const BILL_STATUS = ["นำเข้าแล้ว", "แบ่งของแล้ว", "จัดของเสร็จ", "ออกบิลครบ", "จบ"];
const STATUS_COLOR = {
  "ร่าง": "bg-gray-100 text-gray-600", "เปิดรับ": "bg-green-100 text-green-700", "ส่งซัพแล้ว": "bg-blue-100 text-blue-700", "คอนเฟิร์มแล้ว": "bg-cyan-100 text-cyan-700",
  "ของทยอยเข้า": "bg-violet-100 text-violet-700", "จบ": "bg-gray-200 text-gray-600",
  "นำเข้าแล้ว": "bg-amber-100 text-amber-700", "แบ่งของแล้ว": "bg-blue-100 text-blue-700", "จัดของเสร็จ": "bg-cyan-100 text-cyan-700", "ออกบิลครบ": "bg-green-100 text-green-700",
  "รอจัด": "bg-gray-100 text-gray-600", "กำลังจัด": "bg-amber-100 text-amber-700", "จัดครบ": "bg-green-100 text-green-700",
  "ค้างชำระ": "bg-red-100 text-red-700", "ชำระบางส่วน": "bg-amber-100 text-amber-700", "ชำระแล้ว": "bg-green-100 text-green-700", "ยกเลิก": "bg-gray-200 text-gray-500"
};
const ALLOC_METHODS = { fg: "ตามสัดส่วน · F (สั่งแรก) ก่อน แล้วค่อย G (สั่งเพิ่ม)", prop: "ตามสัดส่วน · รวม F+G", prio: "ตามลำดับร้าน (สั่งก่อนได้ก่อน)", rr: "วนแจกทีละชิ้น" };

let S = {
  pin: "", user: null, boot: null, page: "home",
  round: null, roundTab: "offers", draft: {},      // หน้ารอบสั่ง
  bill: null, billTab: "alloc", alloc: {}, allocMethod: "fg", closeShort: true,   // หน้าบิลสินค้าเข้า
  pending: [], filter: ""
};

// ---------- utils ----------
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
function apiUrl() { return (ls(URL_KEY) || "").trim() || API_URL_DEFAULT; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function jsq(s) { return esc(JSON.stringify(String(s == null ? "" : s))); }
function n0(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function isBlank(v) { return v === "" || v === null || v === undefined; }
function fmt(n) { return Number(n || 0).toLocaleString("th-TH", { maximumFractionDigits: 2 }); }
function fmt2(n) { return Number(n || 0).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function money(n) { return "฿" + fmt2(n); }
function r2(x) { return Math.round(n0(x) * 100) / 100; }
function fmtDate(s) { if (!s) return ""; const p = String(s).slice(0, 10).split("-"); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function todayStr() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); }
function daysTo(dateStr) { if (!dateStr) return null; const d = new Date(String(dateStr).slice(0, 10) + "T00:00:00+07:00"); const t = new Date(todayStr() + "T00:00:00+07:00"); return Math.round((d - t) / 86400e3); }
function chip(s) { return `<span class="chip ${STATUS_COLOR[s] || "bg-gray-100 text-gray-600"}">${esc(s)}</span>`; }
function safeFile(s) { return String(s || "").replace(/[\\/:*?"<>|]+/g, "_").trim(); }
let toastTimer;
function toast(msg, isErr) {
  const t = document.getElementById("toast"); t.textContent = msg;
  t.className = "fixed bottom-5 left-1/2 -translate-x-1/2 text-white text-sm px-4 py-2.5 rounded-full shadow-lg z-[200] max-w-[90%] text-center " + (isErr ? "bg-red-600" : "bg-gray-900");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), isErr ? 6000 : 2600);
}
let busyN = 0; function busy(on) { busyN += on ? 1 : -1; document.getElementById("busy").classList.toggle("hidden", busyN <= 0); }
async function api(action, payload) {
  const url = apiUrl(); if (!url) throw new Error("ยังไม่ได้ตั้ง URL เซิร์ฟเวอร์ — กด ⚙️");
  busy(true);
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ action, pin: S.pin }, payload || {})) });
    const r = await res.json();
    if (!r || r.status !== "success") throw new Error((r && r.message) || "เซิร์ฟเวอร์ตอบผิดพลาด");
    return r.data;
  } finally { busy(false); }
}
async function run(fn) { try { return await fn(); } catch (e) { console.error(e); toast(e.message || String(e), true); } }
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("คัดลอกแล้ว — วางใน LINE ได้เลย"); }
  catch (e) { openModal(`<h3 class="font-bold mb-2">คัดลอกข้อความ</h3><textarea class="w-full h-72 border rounded-lg p-2 text-sm" readonly>${esc(text)}</textarea><div class="text-right mt-2"><button class="btn btn-w" onclick="closeModal()">ปิด</button></div>`); }
}
function openModal(html) { document.getElementById("modalBody").innerHTML = html; document.getElementById("modal").classList.remove("hidden"); }
function closeModal() { document.getElementById("modal").classList.add("hidden"); }
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
function openUrlSetting() {
  openModal(`<h3 class="font-bold mb-2">⚙️ URL เซิร์ฟเวอร์ (Apps Script)</h3>
    <p class="text-xs text-gray-500 mb-2">คัดลอกจาก Apps Script &gt; Deploy &gt; Manage deployments (ลงท้าย /exec)</p>
    <input id="urlInput" class="w-full border rounded-lg px-3 py-2 text-sm" value="${esc(apiUrl())}">
    <div class="flex justify-end gap-2 mt-3"><button class="btn btn-w" onclick="closeModal()">ปิด</button>
    <button class="btn btn-p" onclick="ls('${URL_KEY}', document.getElementById('urlInput').value.trim()); closeModal(); toast('บันทึก URL แล้ว')">บันทึก</button></div>`);
}
function wireDrop(id, cb) {
  const el = document.getElementById(id); if (!el) return;
  ["dragenter", "dragover"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.add("drag"); }));
  ["dragleave", "drop"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.remove("drag"); }));
  el.addEventListener("drop", e => { if (e.dataTransfer.files.length) cb(e.dataTransfer.files); });
}
function pickFiles(accept, multiple, cb) {
  // ต้องแปะ input ไว้ในหน้า (ซ่อน) — บางเบราว์เซอร์/iPad ไม่ส่ง change ให้ input ที่ไม่ได้อยู่ในหน้า
  const i = document.createElement("input"); i.type = "file"; i.accept = accept; i.multiple = !!multiple; i.style.display = "none";
  i.onchange = () => { const f = Array.from(i.files || []); i.remove(); if (f.length) cb(f); };
  document.body.appendChild(i); i.click();
}

// ---------- login / nav ----------
async function login(pin) {
  S.pin = pin; const u = await api("login"); S.user = u; ss(PIN_KEY, pin);
  document.getElementById("userName").innerHTML = esc(u.name) + ` (${esc(u.role)})` + (u.requirePin === false ? ` <span class="chip bg-amber-100 text-amber-700" title="pm_backend.gs: REQUIRE_PIN = false">โหมดทดสอบ ไม่ใช้ PIN</span>` : "");
  document.getElementById("loginView").classList.add("hidden"); document.getElementById("mainView").classList.remove("hidden");
  await loadBoot();
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("offer=") && !isStore()) { const [rid, no] = decodeURIComponent(h.slice(6)).split("|"); openOfferPage(rid, no); }
  else if (h.startsWith("round=") && !isStore()) openRound(decodeURIComponent(h.slice(6)));
  else if (h.startsWith("bill=")) openBill(decodeURIComponent(h.slice(5)));
  else if (h.startsWith("sup=") && !isStore()) openSup(decodeURIComponent(h.slice(4)));
  else go(isStore() ? "bills" : "home");
}
document.getElementById("loginBtn").onclick = async () => {
  const pin = document.getElementById("pinInput").value.trim(), err = document.getElementById("loginErr"), btn = document.getElementById("loginBtn");
  err.classList.add("hidden"); btn.disabled = true;
  try { await login(pin); } catch (e) { err.textContent = e.message; err.classList.remove("hidden"); }
  btn.disabled = false;
};
document.getElementById("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("loginBtn").click(); });
function logout() { ss(PIN_KEY, null); location.hash = ""; if (S.user && S.user.requirePin === false) { document.getElementById("loginView").classList.remove("hidden"); document.getElementById("mainView").classList.add("hidden"); return; } location.reload(); }
function isStore() { return S.user && S.user.role === "Store"; }
function isAdmin() { return S.user && S.user.role === "Admin"; }
async function loadBoot() { S.boot = await api("bootstrap"); }
const PAGES = [
  { id: "home", icon: "fa-house", label: "หน้าแรก" }, { id: "rounds", icon: "fa-file-signature", label: "รอบสั่ง" },
  { id: "sup", icon: "fa-boxes-packing", label: "บิลซัพ" },
  { id: "bills", icon: "fa-truck-ramp-box", label: "บิลสินค้าเข้า" }, { id: "invoices", icon: "fa-file-invoice-dollar", label: "ใบแจ้งหนี้" },
  { id: "settings", icon: "fa-sliders", label: "ตั้งค่า" }
];
function renderNav() {
  const pages = isStore() ? [{ id: "bills", icon: "fa-dolly", label: "จัดของ" }] : PAGES;
  document.getElementById("nav").innerHTML = pages.map(p => `<div class="nav ${S.page === p.id ? "on" : ""}" onclick="go('${p.id}')"><i class="fa-solid ${p.icon}"></i><span class="hidden sm:inline">${p.label}</span></div>`).join("");
}
function hasDraft() { return Object.keys(S.draft || {}).some(k => Object.keys(S.draft[k] || {}).length) || Object.keys(S.alloc || {}).length || Object.keys(S.dd || {}).length; }
// กันหน้าเก่าที่โหลดช้าวาดทับหน้าใหม่: ทุกครั้งที่เปลี่ยนหน้าได้เลขใหม่ — งานที่โหลดเสร็จทีหลังเช็กว่าเลขยังตรงก่อนวาด
function navStart() { S.nav = (S.nav || 0) + 1; return S.nav; }
function stale(t) { return t !== S.nav; }
async function go(page) {
  if (hasDraft() && !confirm("มีตัวเลขที่ยังไม่ได้บันทึก — ออกจากหน้านี้เลยไหม?")) return;
  const t = navStart();
  S.page = page; S.round = null; S.bill = null; S.draft = {}; S.alloc = {}; S.pending = [];
  location.hash = ""; renderNav();
  const v = document.getElementById("view");
  v.innerHTML = `<div class="card text-center text-gray-400 py-8"><i class="fa-solid fa-spinner fa-spin"></i></div>`;
  await run(async () => {
    if (!(page === "sup" && S.boot)) await loadBoot();   // หน้าบิลซัพโหลดข้อมูลของตัวเอง ไม่ต้องรอ bootstrap ซ้ำ
    if (stale(t)) return;
    await ({ home: renderHome, rounds: renderRounds, sup: renderSupList, bills: renderBills, invoices: renderInvoices, settings: renderSettings })[page](v);
  });
}
window.addEventListener("beforeunload", e => { if (hasDraft()) { e.preventDefault(); e.returnValue = ""; } });

// ===================================================================
//  อ่านไฟล์ Excel (ใช้ร่วมกันทุกหน้า)
// ===================================================================
async function readBook(file) { const buf = await file.arrayBuffer(); return { buf, wb: XLSX.read(buf, { type: "array" }) }; }
function gridOf(ws, maxRows) {
  if (!ws || !ws["!ref"]) return [];
  const r = XLSX.utils.decode_range(ws["!ref"]), out = [];
  for (let R = 0; R <= Math.min(r.e.r, (maxRows || 20000) - 1); R++) {
    const row = [];
    for (let C = 0; C <= Math.min(r.e.c, 60); C++) { const c = ws[XLSX.utils.encode_cell({ r: R, c: C })]; row[C] = c ? c.v : null; }
    out.push(row);
  }
  return out;
}
function normBarcode(v) {
  if (v === null || v === undefined || v === "") return "";
  if (typeof v === "number") return v > 0 && Number.isFinite(v) ? String(Math.round(v)) : "";
  const s = String(v).trim().replace(/^'+/, "");
  if (/^[\d\s\-]+$/.test(s)) return s.replace(/\D/g, "");
  if (/^\d+(\.\d+)?e\+\d+$/i.test(s)) return String(Math.round(Number(s)));
  return "";
}
function toQty(v) { if (typeof v === "number") return v; const s = String(v == null ? "" : v).replace(/[, ]/g, ""); return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : 0; }
function hdr(v) { return String(v == null ? "" : v).replace(/\s+/g, " ").trim(); }
function itemKeyOf(barcode, name) { const b = String(barcode || "").replace(/\D/g, ""); return b.length >= 6 ? b : "N:" + String(name || "").toUpperCase().replace(/\s+/g, " ").trim(); }
function colName(i) { return XLSX.utils.encode_col(i); }
const RX = {
  barcode: [/full\s*jan/i, /barcode|บาร์โค้ด/i, /jan|ean/i],
  oldBarcode: [/old\s*full\s*jan/i, /old\s*barcode/i],
  name: [/item\s*name/i, /description/i, /ชื่อสินค้า|รายการสินค้า/, /product/i, /^name$/i],
  itemCode: [/^item\s*(no\.?|code)$/i],
  series: [/^series/i], month: [/^month$/i], yen: [/retail.*jpy|yen|jpy/i],

/** กราฟแท่งคู่ต่อเดือน (ก่อน / หลัง / บิลจริง) — SVG ไม่ต้องโหลดไลบรารี + tooltip ตอนชี้ */
function dashChart(months, cur) {
  const W = 1080, H = 260, padL = 64, padB = 34, padT = 12, n = months.length;
  const max = Math.max(1, ...months.map(m => Math.max(m.before, m.after, m.bills)));
  const step = (() => { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= raw); })();
  const top = Math.ceil(max / step) * step, y = val => padT + (H - padT - padB) * (1 - val / top);
  const gw = (W - padL - 10) / n, bw = Math.max(6, Math.min(26, (gw - 14) / 3));
  let g = "";
  for (let t = 0; t <= top + 1e-6; t += step) g += `<line x1="${padL}" x2="${W - 6}" y1="${y(t)}" y2="${y(t)}" stroke="#e5e7eb"/><text x="${padL - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#6b7280">${kmoney(t)}</text>`;
  const bars = months.map((m, i) => {
    const x0 = padL + gw * i + (gw - bw * 3 - 4) / 2;
    const bar = (val, k, j) => { const yy = y(val), h = Math.max(0, H - padB - yy); const r = Math.min(4, h / 2);
      return h ? `<path d="M${x0 + j * (bw + 2)},${H - padB} V${yy + r} q0,-${r} ${r},-${r} h${bw - 2 * r} q${r},0 ${r},${r} V${H - padB} Z" fill="${VIZ[k]}"/>` : ""; };
    const tip = `${monLabel(m.month)}\nตามที่สั่ง: ${money(m.before)}\nหลังคอนเฟิร์ม/ตัด: ${money(m.after)}${m.afterUnconfirmed ? "\n  (ยังไม่คอนเฟิร์ม " + money(m.afterUnconfirmed) + ")" : ""}\nบิลเข้าจริง: ${money(m.bills)}`;
    return `<g>${m.month === cur ? `<rect x="${padL + gw * i + 2}" y="${padT}" width="${gw - 4}" height="${H - padT - padB}" fill="#f0fdfa"/>` : ""}
      <rect x="${padL + gw * i}" y="${padT}" width="${gw}" height="${H - padT - padB}" fill="transparent"><title>${esc(tip)}</title></rect>
      ${bar(m.before, "before", 0)}${bar(m.after, "after", 1)}${bar(m.bills, "bills", 2)}
      <text x="${padL + gw * i + gw / 2}" y="${H - padB + 16}" text-anchor="middle" font-size="12" fill="${m.month === cur ? "#0f766e" : "#374151"}" font-weight="${m.month === cur ? 700 : 400}">${esc(monLabel(m.month, 1))}</text>
      ${m.after ? `<text x="${x0 + bw * 1.5 + 2}" y="${y(m.after) - 5}" text-anchor="middle" font-size="10" fill="#374151">${kmoney(m.after)}</text>` : ""}</g>`;
  }).join("");
  return `<div class="overflow-x-auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${Math.max(360, n * 90)}px;height:auto" role="img" aria-label="กราฟเงินสำรองจ่ายรายเดือน">${g}<line x1="${padL}" x2="${W - 6}" y1="${H - padB}" y2="${H - padB}" stroke="#9ca3af"/>${bars}</svg></div>`;
}
function exportDash() {

  const aoa = [["เดือนที่ของออก", "ชิ้นตามสั่ง", "ชิ้นหลังคอนเฟิร์ม", "① ตามที่สั่ง", "② หลังคอนเฟิร์ม/ตัด", "② − ①", "รับของแล้ว", "คอนเฟิร์มแล้ว", "ยังไม่คอนเฟิร์ม", "บิลเข้าจริง"]];
  D.months.forEach(m => aoa.push([monLabel(m.month), m.pcsBefore, m.pcsAfter, m.before, m.after, r2(m.after - m.before), m.afterReceived, m.afterConfirmed, m.afterUnconfirmed, m.bills]));

}

function deriveRound() {
  const R = S.round, D = S.draft;
  const items = R.items.map(it => Object.assign({ id: it.offerNo + "|" + it.key }, it));
  const byId = {}; items.forEach(it => byId[it.id] = it);
  const ws = {}, wsTotal = {}, shop = {}, codes = {};
  R.lines.forEach(l => {
    const id = l.offerNo + "|" + l.key;
    if (!byId[id]) { const x = { id, offerNo: l.offerNo, key: l.key, barcode: l.barcode, name: l.name, orphan: true, orderQty: "", prelimQty: "" }; items.push(x); byId[id] = x; }
    if (l.code === SHOP_CODE) { shop[id] = (shop[id] || 0) + l.qty; return; }
    (ws[id] = ws[id] || {})[l.code] = (ws[id][l.code] || 0) + l.qty;
    wsTotal[id] = (wsTotal[id] || 0) + l.qty;
    codes[l.code] = codes[l.code] || { code: l.code, name: l.customer, first: l.importedAt };
    if (l.importedAt < codes[l.code].first) codes[l.code].first = l.importedAt;
  });
  const custs = Object.values(codes).sort((a, b) => String(a.first).localeCompare(String(b.first)) || a.name.localeCompare(b.name, "th"));
  const cut = id => (id in D.cut) ? !!D.cut[id] : !!byId[id].cut;
  const shopQty = id => (id in D.shop) ? n0(D.shop[id]) : (shop[id] || 0);
  const demand = id => (wsTotal[id] || 0) + shopQty(id);
  const orderQty = id => { if (cut(id)) return 0; if (id in D.order) return n0(D.order[id]); const v = byId[id].orderQty; return isBlank(v) ? demand(id) : n0(v); };
  const prelim = id => { if (cut(id)) return 0; if (id in D.prelim) return isBlank(D.prelim[id]) ? null : n0(D.prelim[id]); const v = byId[id].prelimQty; return isBlank(v) ? null : n0(v); };
  return { items, byId, ws, wsTotal, custs, cut, shopQty, demand, orderQty, prelim };
}

async function addWSFiles(files) {
  const keySet = new Set(S.round.items.map(i => i.key));
  for (const f of Array.from(files)) {
    try {
      const { wb } = await readBook(f); const sheet = pickSheet(wb, keySet, "รวม"); const grid = gridOf(wb.Sheets[sheet]); const map = detectMap(grid, keySet);
      const rows = extract(grid, map);
      let offerNo = findOfferNo(rows, f.name);
      if (!S.round.offers.some(o => o.offerNo === offerNo)) {   // เดาจากสินค้าที่ตรงกับ Offer ไหนมากสุด
        const cnt = {}; rows.filter(r => r.qty > 0).forEach(r => S.round.items.filter(i => i.key === r.barcode).forEach(i => cnt[i.offerNo] = (cnt[i.offerNo] || 0) + 1));
        offerNo = (Object.entries(cnt).sort((a, b) => b[1] - a[1])[0] || [S.round.offers[0] ? S.round.offers[0].offerNo : "-"])[0];
      }
      const c = guessCustomer(f.name);
      S.pending.push({ id: Math.random().toString(36).slice(2), fileName: f.name, wb, sheet, grid, map, offerNo, code: c ? c.code : "", cname: c ? c.name : "" });
    } catch (e) { toast(f.name + ": " + e.message, true); }
  }
  renderWSPend();
}

async function prepareFill(file, offerNo) {
  if (!/\.xls[xm]$/i.test(file.name)) throw new Error("ต้องเป็นไฟล์ .xlsx");
  const { buf, wb } = await readBook(file), D = deriveRound();
  const keySet = new Set(D.items.filter(i => i.offerNo === offerNo).map(i => i.key));
  const sheet = pickSheet(wb, keySet), grid = gridOf(wb.Sheets[sheet]), map = detectMap(grid, keySet);
  S.fill = { file, buf, wb, sheet, grid, map, offerNo, clearOthers: true };
  renderFillModal();
}
function fillPlan() {
  const f = S.fill, D = deriveRound(), want = {};
  D.items.filter(i => i.offerNo === f.offerNo && !i.orphan).forEach(i => { const o = D.orderQty(i.id); if (o > 0) want[i.key] = o; });
  const hits = [], seen = {}; let cleared = 0;
  for (let r = f.map.headerRow + 1; r < f.grid.length; r++) {
    const b = normBarcode((f.grid[r] || [])[f.map.barcode]); if (!b || b.length < 6) continue;
    if (want[b] !== undefined && !seen[b]) { hits.push({ r, qty: want[b] }); seen[b] = 1; }
    else if (f.clearOthers) { const cur = (f.grid[r] || [])[f.map.qty]; if (cur !== null && cur !== "" && cur !== 0) { hits.push({ r, qty: null }); cleared++; } }
  }
  const missing = Object.keys(want).filter(k => !seen[k]).map(k => ({ key: k, name: (D.items.find(i => i.key === k && i.offerNo === f.offerNo) || {}).name, qty: want[k] }));
  return { hits, missing, cleared, filled: hits.filter(h => h.qty !== null).length, pcs: hits.reduce((s, h) => s + (h.qty || 0), 0) };
}

/** ประมาณการ: ร้านได้ก่อน (ตามยอดร้าน) → WS ตามสัดส่วน */
function prelimEstimate(D) {
  const est = {};   // id -> {shop, ws:{code:qty}}
  D.items.forEach(i => {
    const p = D.prelim(i.id); if (p === null) return;
    const shop = Math.min(D.shopQty(i.id), p), rest = p - shop;
    const entries = D.custs.filter(c => (D.ws[i.id] || {})[c.code]).map(c => ({ id: c.code, qty: D.ws[i.id][c.code] }));
    est[i.id] = { shop, ws: allocate(rest, entries, "prop") };
  });
  return est;
}

async function prelimFile(file) {
  const { wb } = await readBook(file), D = deriveRound();
  const keySet = new Set(D.items.map(i => i.key));
  const sheet = pickSheet(wb, keySet), grid = gridOf(wb.Sheets[sheet]), map = detectMap(grid, keySet);
  const got = {};
  // ช่องว่าง = ซัพยังไม่ยืนยัน (ไม่ใช่ 0) · ใส่ 0 หรือ Cut = ได้ 0
  extract(grid, map).forEach(r => { if (r.barcode && keySet.has(r.barcode) && (!r.qtyBlank || r.cut)) got[r.barcode] = (got[r.barcode] || 0) + (r.cut ? 0 : r.qty); });
  let n = 0;
  D.items.forEach(i => { if (i.key in got && (D.orderQty(i.id) > 0 || got[i.key] > 0)) { S.draft.prelim[i.id] = String(got[i.key]); n++; } });
  renderRound(); toast(`ใส่ยอดขั้นต้น ${n} รายการ (คอลัมน์ ${map.qty >= 0 ? colName(map.qty) + " · " + hdr((grid[map.headerRow] || [])[map.qty]) : "?"}) — ตรวจแล้วกดบันทึก`);
}

function copyPrelim(code) {
  const D = deriveRound(), est = prelimEstimate(D), R = S.round.round;

  const lines = [`📦 ${R.name} (${R.supplier} ${R.line}) — ร้าน ${custName(code)}`, `ยอดประมาณการเบื้องต้นจากซัพ (อาจเปลี่ยนตอนของเข้า)`, ""];

  lines.push("", `รวมสั่ง ${fmt(a)} ชิ้น · คาดว่าได้ ${fmt(b)} ชิ้น`);
  copyText(lines.join("\n"));
}

function mSet(i, k, v) {

}
function mQty(i, code, v) { const q = Math.max(0, Math.round(n0(String(v).replace(/,/g, "")))); if (q) S.manual.rows[i].qty[code] = q; else delete S.manual.rows[i].qty[code]; renderManual(); }
function mAddCust(v) {

}

}
function mPaste() {
  openModal(`<h3 class="font-bold mb-2">วางรายการจาก Excel</h3>
    <p class="text-xs muted mb-2">ลำดับคอลัมน์: บาร์โค้ด · ชื่อ · Price 1 · Price 2 · ชิ้น/ลัง · จำนวนสั่งเข้าร้าน (มีไม่ครบก็ได้ คั่นด้วย Tab)</p>

    <div class="flex justify-end gap-2 mt-3"><button class="btn btn-w" onclick="closeModal()">ยกเลิก</button><button class="btn btn-p" onclick="mPasteOk()">ใส่ในตาราง</button></div>`);

function mPasteOk() {

    r.barcode = String(c[0] || "").replace(/[\s-]/g, ""); r.name = (c[1] || "").trim();
    const num = (x) => { const v = String(x || "").replace(/,/g, "").trim(); return v === "" ? "" : n0(v); };
    r.price1 = num(c[2]); r.price2 = num(c[3]); r.pcsCtn = num(c[4]); const q = num(c[5]); if (q) r.qty[SHOP_CODE] = q;

async function saveManual() {
  const m = S.manual, R = S.round, rid = R.round.roundId;
  if (!m.offerNo) return toast("ใส่เลขบิล / Offer ก่อน", true);
  if (!m.isEdit && R.offers.some(o => o.offerNo === m.offerNo)) return toast("เลข " + m.offerNo + " มีในรอบนี้แล้ว — ใช้เลขอื่น หรือกดแก้ไขบิลเดิม", true);
  const rows = m.rows.filter(r => r.barcode || r.name);
  if (!rows.length) return toast("ยังไม่มีสินค้าในบิล", true);
  const keys = new Set(); for (const r of rows) { const k = mKey(r.barcode, r.name); if (keys.has(k)) return toast("สินค้าซ้ำในบิล: " + (r.barcode || r.name), true); keys.add(k); }
  const MON = ["", "JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  const monthLabel = /^\d{4}-\d{2}$/.test(m.month) ? m.month : "";
  await run(async () => {
    await api("importOffer", { roundId: rid, offerNo: m.offerNo, title: m.title, fileName: MANUAL_FILE, closeAt: m.closeAt, month: monthLabel,
      items: rows.map(r => ({ barcode: r.barcode, name: r.name, month: monthLabel, pcsCtn: r.pcsCtn === "" ? "" : r.pcsCtn, price1: r.price1 === "" ? "" : r.price1,
        price2: r.price2 === "" ? "" : r.price2, remark: r.remark, isNew: !!(r.barcode && S.products && !S.products.get(r.barcode.replace(/\D/g, ""))) })) });
    // ยอดร้าน (SHOP): ส่งทุกแถว (0 = ลบยอดเดิม)
    await api("saveShopQty", { roundId: rid, items: rows.map(r => ({ offerNo: m.offerNo, key: mKey(r.barcode, r.name), qty: n0(r.qty[SHOP_CODE]) })) });
    // ยอด WS ต่อคน (แทนที่ยอดเดิมของ Offer นี้)
    for (const c of m.cust) {
      const lines = rows.filter(r => n0(r.qty[c.code]) > 0).map(r => ({ barcode: r.barcode, name: r.name, qty: n0(r.qty[c.code]) }));
      if (lines.length) await api("importOrders", { roundId: rid, offerNo: m.offerNo, customerCode: c.code, customerName: c.name, fileName: MANUAL_FILE, lines });
      else if (m.prevCust.includes(c.code)) await api("removeOrders", { roundId: rid, offerNo: m.offerNo, customerCode: c.code });

<script>

//  บิลซัพ (ไม่ใช่ Dreamtoy) — v3.3
//  1 บิล = 1 รอบ (SUP-yyMM-NN) + 1 Offer · บันทึกลงไฟล์ PM อย่างเดียว

const SP_TYPES = ["พรีออเดอร์", "สั่งเข้าร้าน"];
const SP_OPEN = ["ร่าง", "เปิดรับ"];
const SP_SENT = ["ส่งซัพแล้ว", "คอนเฟิร์มแล้ว", "ของทยอยเข้า"];

function spRemindList(s) { const a = String(s || "").split(/[,\s]+/).map(Number).filter(n => n >= 0 && n < 400); return a.length ? a : [3, 1]; }
/** บิลที่ถึงรอบเตือนแล้ว (ยังเปิดรับ/ร่าง และเหลือวัน ≤ วันเตือนที่มากที่สุด หรือเลยกำหนด) */
function spDue(b) {
  if (!SP_OPEN.includes(b.status) || !b.closeAt) return null;
  const d = daysTo(b.closeAt); if (d === null) return null;
  return d <= Math.max(...spRemindList(b.remindDays)) ? d : null;
}
function spDueText(d) { return d < 0 ? `เลยกำหนด ${-d} วัน` : d === 0 ? "ปิดวันนี้" : `อีก ${d} วัน`; }
function spMonth(ym) { const m = /^(\d{4})-(\d{2})/.exec(ym || ""); return m ? `${m[2]}/${m[1]}` : (ym || ""); }
function eanOk(b) {
  b = String(b || ""); if (!/^\d+$/.test(b) || ![8, 12, 13, 14].includes(b.length)) return null;
  const ds = b.split("").map(Number), chk = ds.pop(); let s = 0;
  ds.reverse().forEach((d, i) => { s += d * (i % 2 === 0 ? 3 : 1); });
  return (10 - (s % 10)) % 10 === chk;
}
function spDirty() { S.draft = S.draft || {}; S.draft.sp = { x: 1 }; }

// ---------- แถบเตือนบนหน้าแรก ----------
const _renderHomeBase = renderHome;
renderHome = async function (v) {

    ${due.map(r => `<div class="text-sm flex flex-wrap gap-2 items-center py-0.5"><a href="#" class="font-semibold text-red-800 underline" onclick="openSup(${jsq(r.roundId)}); return false">${esc(r.name)}</a>

// ---------- รายการบิลซัพ ----------

// ---------- เปิด / สร้าง ----------

// ---------- หน้ากรอก ----------

  const d = daysTo(m.closeAt);
  v.innerHTML = `
  <div class="pb-28">

      <h3 class="font-bold mr-auto">${m.isEdit ? "บิลซัพ " + esc(m.supplier + " " + m.offerNo) : "กรอกบิลซัพใหม่"} ${m.isEdit ? chip(m.status) : ""}</h3>

function spHead(k, v) { S.sp[k] = String(v).trim(); spDirty(); renderSup(); }
const SP_NUM = ["yen", "cost", "price1", "price2", "pcsCtn", "shopQty", "extraQty"];

}
function spQty(i, code, v) { const q = Math.max(0, Math.round(n0(String(v).replace(/,/g, "")))); if (q) S.sp.rows[i].qty[code] = q; else delete S.sp.rows[i].qty[code]; spDirty(); renderSup(); }
function spDelRow(i) {

function spAddCust(v) {

function spPasteOk() {

/** ใส่รายการเข้าบิล: บาร์โค้ดซ้ำ = อัปเดตช่องที่มีค่า, ใหม่ = ต่อท้าย */
function spMerge(add) {
  const rows = S.sp.rows.filter(r => r.barcode || r.name);
  add.forEach(a => {
    const ex = a.barcode && rows.find(r => r.barcode === a.barcode);
    if (ex) Object.keys(a).forEach(k => { if (k !== "qty" && a[k] !== "" && a[k] != null) ex[k] = a[k]; });
    else rows.push(a);
  });
  S.sp.rows = rows.length ? rows : [spEmptyRow()]; spDirty(); renderSup();
}

// ---------- อ่านไฟล์ซัพ (.xlsx) ช่วยกรอก ----------
function spYm(v) {
  if (v === null || v === undefined || v === "") return "";
  if (v instanceof Date) return v.toISOString().slice(0, 7);
  if (typeof v === "number" && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 7);
  const s = String(v).trim();
  let m = /(\d{4})[-\/.](\d{1,2})/.exec(s); if (m) return m[1] + "-" + m[2].padStart(2, "0");
  m = /(\d{1,2})[-\/.](\d{4})/.exec(s); if (m) return m[2] + "-" + m[1].padStart(2, "0");
  const MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  m = /([A-Za-z]{3})[A-Za-z]*\.?\s*[-'\/ ]?\s*(\d{2,4})/.exec(s);
  if (m && MON.includes(m[1].toUpperCase())) { const y = m[2].length === 2 ? "20" + m[2] : m[2]; return y + "-" + String(MON.indexOf(m[1].toUpperCase()) + 1).padStart(2, "0"); }
  return "";
}
function spParseGrid(grid, fileName) {
  let hr = -1;
  for (let r = 0; r < Math.min(grid.length, 40); r++) {
    const t = (grid[r] || []).map(hdr);
    if (t.some(x => /barcode|jan\s*code|บาร์โค้ด/i.test(x)) && t.some(x => /item\s*name|description|ชื่อสินค้า|product\s*name/i.test(x))) { hr = r; break; }
  }
  if (hr < 0) return null;
  const H = (grid[hr] || []).map(hdr), H2 = (grid[hr + 1] || []).map(hdr);
  const col = (re, row) => (row || H).findIndex(x => x && re.test(x));
  const c = {
    barcode: col(/barcode|jan\s*code|บาร์โค้ด/i), itemCode: col(/^item\s*(no\.?|code)$/i), name: col(/item\s*name|description|ชื่อสินค้า|product\s*name/i),
    cat: col(/^category/i), series: col(/series/i), ptype: col(/product\s*type/i), yen: col(/retail|yen|jpy|ราคาญี่ปุ่น/i),
    pcs: col(/pcs\s*\/?\s*c(ar)?t(o)?n|ชิ้น\s*\/\s*ลัง/i), jp: col(/jpn?\s*launch|release/i), asia: col(/asia\s*obs|\beta\b|arrival/i), remark: col(/^remarks?$/i),
    retail: Math.max(col(/ขายปลีก|retail\s*price|srp/i, H2), -1), whole: Math.max(col(/ขายส่ง|wholesale|dealer/i, H2), -1)
  };
  if (c.retail < 0) c.retail = col(/ขายปลีก|ราคาขายปลีก/i); if (c.whole < 0) c.whole = col(/ขายส่ง|ต้นทุน|cost/i);
  // เลข Offer + ชื่อบิล จากแถวบน ๆ
  let offerNo = "", title = "";
  for (let r = 0; r < hr; r++) {
    const row = grid[r] || []; const i = row.findIndex(x => /offer\s*(number|no\.?)/i.test(hdr(x)));
    if (i >= 0) { const rest = row.slice(i + 1).filter(x => hdr(x)); offerNo = hdr(rest[0]); title = hdr(rest[1]); break; }
  }
  if (!offerNo) { const m = /(\d{4,6})/.exec(fileName || ""); if (m) offerNo = m[1]; }
  const v = (row, i) => i >= 0 ? row[i] : "";
  const items = [];
  for (let r = hr + 1; r < grid.length; r++) {
    const row = grid[r] || [];
    const bc = normBarcode(v(row, c.barcode)), name = hdr(v(row, c.name));
    if (!bc && !name) continue;
    if (!bc && /ขายปลีก|ขายส่ง|total/i.test(name)) continue;
    const it = spEmptyRow();
    it.barcode = bc; it.name = name; it.itemCode = hdr(v(row, c.itemCode));
    it.series = [v(row, c.cat), v(row, c.series), v(row, c.ptype)].map(hdr).filter(Boolean).join(" · ");
    it.yen = spNum(v(row, c.yen)); it.pcsCtn = spNum(v(row, c.pcs)); it.price1 = spNum(v(row, c.retail)); it.cost = spNum(v(row, c.whole));
    it.remark = hdr(v(row, c.remark)); it._jp = spYm(v(row, c.jp)); it._asia = spYm(v(row, c.asia));
    ["yen", "pcsCtn", "price1", "cost"].forEach(k => { if (typeof it[k] !== "number") it[k] = ""; });
    items.push(it);
  }
  return { offerNo, title, items };
}
async function spImportFile(file) {
  if (!file) return;
  await run(async () => {
    const { wb } = await readBook(file);
    let res = null;
    for (const n of wb.SheetNames) { res = spParseGrid(gridOf(wb.Sheets[n], 3000), file.name); if (res && res.items.length) break; }
    if (!res || !res.items.length) return toast("อ่านไฟล์ไม่ได้ — หาแถวหัวตารางที่มี Barcode + Item name ไม่เจอ (ใช้ วางจาก Excel แทน)", true);
    const m = S.sp, first = (k) => res.items.map(x => x[k]).filter(Boolean).sort()[0] || "";
    if (!m.offerNo && res.offerNo) m.offerNo = res.offerNo;
    if (!m.title && res.title) m.title = res.title;
    if (!m.jpLaunch) m.jpLaunch = first("_jp");
    if (!m.arrive) m.arrive = first("_asia");

// ---------- ขั้นราคา (1 ลัง / ครึ่งลัง …) จากไฟล์ซัพ — v3.6 ----------
// r.tiers = { t:[{min, price, label}] (min น้อย→มาก), m:1 = แก้ทุนเอง (ไม่เลือกขั้นให้), vat }
function spTier(r) {
  const T = r.tiers && r.tiers.t ? r.tiers.t.slice().sort((a, b) => a.min - b.min) : [];
  if (!T.length) return null;
  const tot = spTotal(r), ok = T.filter(t => tot >= t.min);
  const cur = ok.length ? ok.reduce((a, b) => (b.price < a.price ? b : a)) : null;
  const ref = cur || T[0];
  const next = T.filter(t => t.min > tot && t.price < ref.price).sort((a, b) => a.min - b.min)[0] || null;
  return { T, tot, cur, below: !cur, ref, next };
}
function spTierApply(r) {
  const x = spTier(r); if (!x || r.tiers.m) return;
  r.cost = x.ref.price;
}
function spTierText(r) {
  const x = spTier(r); if (!x) return "";
  const list = x.T.slice().reverse().map(t => `${t.label} ≥${fmt(t.min)} ฿${fmt(t.price)}`).join(" | ");
  const head = r.tiers.m ? `ราคาตกลงเอง ฿${fmt(n0(r.cost))}` : x.below ? `ต่ำกว่า${x.T[0].label} ใช้ ฿${fmt(x.ref.price)}` : `ใช้ราคา${x.cur.label}`;
  return `[${head} · ${list}${r.tiers.vat ? " · +VAT" + r.tiers.vat + "%" : ""}]`;
}
function spStripTier(s) { return String(s || "").replace(/^\[[^\]]*\]\s*/, ""); }
function spTierBadge(r, i) {
  const x = spTier(r); if (!x) return "";
  if (r.tiers.m) return `<div class="text-[11px] mt-0.5"><span class="chip bg-gray-200 text-gray-800">ราคาตกลงเอง</span>
    <a href="#" class="text-teal-700 underline" onclick="S.sp.rows[${i}].tiers.m=0; spDirty(); renderSup(); return false">ใช้ขั้นราคา</a></div>`;
  const badge = x.below ? `<span class="chip bg-red-100 text-red-800">ต่ำกว่า${esc(x.T[0].label)} (≥${fmt(x.T[0].min)}) — ซัพอาจไม่รับ</span>`
    : `<span class="chip ${x.cur === x.T[x.T.length - 1] ? "bg-teal-100 text-teal-900" : "bg-amber-100 text-amber-900"}">ราคา${esc(x.cur.label)}</span>`;
  const hint = x.next ? `<div class="text-amber-800">อีก ${fmt(x.next.min - x.tot)} ชิ้น ได้ราคา${esc(x.next.label)} ถูกลง ฿${fmt(r2(x.ref.price - x.next.price))}/ชิ้น</div>` : "";
  return `<div class="text-[11px] mt-0.5">${badge}${hint}<div class="muted">${x.T.slice().reverse().map(t => esc(t.label) + " ≥" + fmt(t.min) + ": ฿" + fmt(t.price)).join(" · ")}</div></div>`;
}
function spPayloadItem(r) {
  const nz = x => x === "" || x == null ? "" : x, tt = spTierText(r);
  return { barcode: r.barcode, itemCode: r.itemCode, name: r.name, series: r.series, yen: nz(r.yen), cost: nz(r.cost), price1: nz(r.price1),
    price2: nz(r.price2), pcsCtn: nz(r.pcsCtn), imageUrl: r.imageUrl, remark: (tt ? tt + (r.remark ? " " : "") : "") + (r.remark || ""),
    shopQty: n0(r.shopQty), extraQty: n0(r.extraQty), tiers: r.tiers || null,
    isNew: !!(r.barcode && S.products && !S.products.get(String(r.barcode).replace(/\D/g, ""))) };
}

function spKey(v) { return String(v || "").toLowerCase().replace(/[^0-9a-z฀-๿]/g, ""); }
function spSups() { return (S.spList && S.spList.suppliers) || []; }
function spFindSup(id, name) {
  const L = spSups(); if (id) { const a = L.find(x => x.id === id); if (a) return a; }
  const k = spKey(name); if (!k) return null;
  return L.find(x => spKey(x.nick) === k || spKey(x.name) === k || String(x.aliases || "").split(/[,;]/).some(a => spKey(a) === k)) || null;
}
function spSupMatch(q) {
  const k = spKey(q), L = spSups();
  if (!k) return L.slice(0, 12);
  const score = x => {
    const f = [x.nick, x.name, x.id, x.taxId, x.contact].concat(String(x.aliases || "").split(/[,;]/)).map(spKey);
    if (f.some(v => v === k)) return 0; if (f.some(v => v.startsWith(k))) return 1; if (f.some(v => v.includes(k))) return 2; return 9;
  };
  return L.map(x => [score(x), x]).filter(a => a[0] < 9).sort((a, b) => a[0] - b[0]).map(a => a[1]).slice(0, 12);
}

// ---------- อ่านไฟล์ตามแม่แบบ ----------
/** หาเลขคอลัมน์ของช่อง: หัวตรงที่ตัวอักษรเดิม → ใช้เลย · ไม่ตรง → หาหัวชื่อนี้ (ตัวที่ o) · ไม่มีหัว (h="") → ใช้ตัวอักษร */

  if (!f || !f.c) return -1;
  const i = imColIdx(f.c), at = imN(H[i]);
  if (!f.h) return i;

  let best = (cfg.hr || 1) - 1, bs = -1;
  for (let r = 0; r < Math.min(grid.length, 40); r++) {

    const sc = fs.filter(f => H.some(x => x && (x === f.h || x.startsWith(f.h)))).length * 10 - Math.abs(r - ((cfg.hr || 1) - 1)) * 0.01;

}

  const hr = imHeaderRow(grid, cfg); out.hr = hr;
  if (hr < 0) { out.missing = ["หัวตาราง"]; return out; }
  const H = grid[hr] || [];
  IM_FIELDS.forEach(([k]) => { out.cols[k] = imResolve(H, (cfg.f || {})[k]); });
  const tiers = (cfg.tiers || []).map(t => ({ label: t.label, q: imResolve(H, t.q), p: imResolve(H, t.p) })).filter(t => t.q >= 0 && t.p >= 0);
  out.tiers = tiers;
  ["barcode", "name"].forEach(k => { if (out.cols[k] < 0) out.missing.push(k === "barcode" ? "บาร์โค้ด" : "ชื่อสินค้า"); });
  if (out.cols.cost < 0 && !tiers.length) out.missing.push("ทุน");
  if (out.missing.length) return out;
  const g = (row, k) => out.cols[k] >= 0 ? row[out.cols[k]] : null, vat = 1 + n0(cfg.vat) / 100, money = (x) => x == null ? null : Math.round(x * vat * 100) / 100;
  const seen = new Set();
  for (let r = hr + 1; r < grid.length; r++) {
    const row = grid[r] || [];
    const bc = normBarcode(g(row, "barcode")), name = hdr(g(row, "name"));
    if (!/^\d{8,14}$/.test(bc)) { if (row.some(x => hdr(x))) out.skipped++; continue; }
    if (seen.has(bc)) { out.dup++; continue; } seen.add(bc);
    const it = { bc, name: name || bc, code: hdr(g(row, "itemCode")), group: hdr(g(row, "group")), ctn: imNum(g(row, "ctn")), moq: imNum(g(row, "moq")),
      cost: money(imNum(g(row, "cost"))), sell: imNum(g(row, "sell")), yen: imNum(g(row, "yen")), deadline: imDate(g(row, "deadline")),
      jp: imYm(g(row, "jp")), note: hdr(g(row, "note")), img: /^https?:\/\//.test(hdr(g(row, "img"))) ? hdr(g(row, "img")) : "", tiers: [] };
    tiers.forEach(t => { const q = imNum(row[t.q]), p = money(imNum(row[t.p])); if (q > 0 && p > 0) it.tiers.push({ min: q, price: p, label: t.label }); });
    it.tiers.sort((a, b) => a.min - b.min);
    if (it.tiers.length) { if (!it.moq) it.moq = it.tiers[0].min; if (it.cost == null) it.cost = it.tiers[it.tiers.length - 1].price; }
    if (!it.moq && it.ctn && cfg.moqIsCtn) it.moq = it.ctn;

  // วันปิดทั้งไฟล์ / เลข Offer จากแถวบน ๆ + ชื่อไฟล์
  const top = grid.slice(0, hr).map(row => (row || []).map(hdr).filter(Boolean).join(" ")).concat([fileName || ""]);
  for (const t of top) { if (!out.closeAt && /clos|ปิด|deadline/i.test(t)) { const seg = t.split(/clos(?:ing)?\s*date|ปิดรับ|ปิด|deadline/i).slice(1).join(" "); out.closeAt = imDate(seg) || imDate(t); } }
  for (const t of top) { const m = /offer[\s_]*(?:no\.?|number)?[\s_]*[:#.]?[\s_]*(\d{2,6})/i.exec(t); if (m) { out.offerNo = m[1]; break; } }
  out.title = String(fileName || "").replace(/\.[a-z]+$/i, "").replace(/^[0-9a-f]{8}-/, "").replace(/_/g, " ").slice(0, 60);
  out.ok = true;
  return out;
}

    <div class="text-sm mb-2">บิลให้มา <b>${pos.length}</b> รายการ · <b>${fmt(pos.reduce((s, r) => s + r.qty, 0))}</b> ชิ้น${cutPos ? ` · ในนี้ติด **CUT ${cutPos} รายการ (ยังนำเข้าเพราะบิลยังให้มา)` : ""}${zeroDem.length ? ` · มีคนสั่งแต่บิลให้ 0: <b class="text-red-600">${zeroDem.length}</b> รายการ (นำเข้าไว้ให้เห็นว่าถูกตัด)` : ""}</div>
    <div class="overflow-auto max-h-56 border rounded-lg"><table class="g"><thead><tr><th>บาร์โค้ด</th><th>ชื่อ</th><th class="num">บิล</th><th class="num">P2</th>${p.groups.map(g => `<th class="num">${esc(g.label)} F</th>`).join("")}</tr></thead><tbody>
      ${take.slice(0, 12).map(r => `<tr><td>${esc(r.barcode)}</td><td>${esc(r.name)}</td><td class="num">${fmt(r.qty)}</td><td class="num">${fmt(r.price2)}</td>${r.dem.map(d => `<td class="num">${d.base || ""}${d.add ? ` <span class="text-teal-700">+${d.add}</span>` : ""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="flex justify-end gap-2 mt-3"><button class="btn btn-w" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-p" ${take.length ? "" : "disabled"} onclick="createBill()">นำเข้า ${take.length} รายการ</button></div>`);
}
async function createBill() {
  const p = S.billPend; if (!p.name.trim()) return toast("ใส่ชื่อบิล เช่น Jan 1", true);
  const rows = pendRows().filter(r => r.qty > 0 || r.hasDem);

  const demand = [], aliases = {};
  p.groups.forEach(g => { if (p.gmap[g.label]) aliases[g.label] = p.gmap[g.label]; });
  rows.forEach(r => r.dem.forEach(d => { const code = p.gmap[d.label]; if (code && (d.base || d.add)) demand.push({ barcode: r.barcode, name: r.name, label: d.label, code, customer: custName(code), base: d.base, add: d.add }); }));
  await run(async () => {
    const res = await api("createBill", { name: p.name.trim(), billDate: p.billDate, supplier: p.supplier, fileName: p.file.name, demand, aliases,
      items: rows.map(x => ({ barcode: x.barcode, itemCode: x.itemCode, name: x.name, pcsCtn: x.pcsCtn, price1: x.price1, price2: x.price2, qty: Math.max(0, x.qty), cut: x.cut })) });

async function openBill(id) {

function setBillTab(t) { S.billTab = t; ss("pm_btab_" + S.bill.bill.billId, t); renderBill(); }
function renderBill() {
  const B = S.bill, b = B.bill;
  const tabs = isStore() ? [["pick", "จัดของ"]] : [["addon", "1. ยอดต่อคน / สั่งเพิ่ม"], ["alloc", "2. ของเข้า + แบ่งของ"], ["pick", "3. Store จัดของ"], ["inv", "4. ออกบิล WS"]];
  document.getElementById("view").innerHTML = `
    <div class="card mb-3"><div class="flex flex-wrap items-center gap-2">
      <button class="btn btn-w btn-s" onclick="go('bills')"><i class="fa-solid fa-arrow-left"></i></button>

      ${chip(b.status)}
      ${!isStore() ? `<select class="sel" onchange="run(async()=>{await api('updateBill',{billId:S.bill.bill.billId,status:this.value}); toast('สถานะ: '+this.value)})">${BILL_STATUS.map(s => `<option ${s === b.status ? "selected" : ""}>${s}</option>`).join("")}</select>` : ""}
      ${isAdmin() ? `<button class="btn btn-d btn-s" onclick="delBill()"><i class="fa-solid fa-trash"></i></button>` : ""}
    </div></div>
    <div class="flex gap-2 overflow-x-auto pb-2 mb-2">${tabs.map(([id, l]) => `<div class="tab ${S.billTab === id ? "on" : ""}" onclick="setBillTab('${id}')">${l}</div>`).join("")}</div>

  ({ addon: btAddon, alloc: btAlloc, pick: btPick, inv: btInv })[S.billTab](document.getElementById("bbody"));

async function delBill() {
  if (!confirm("ลบบิลสินค้าเข้านี้ (และการแบ่งของ — ยอดที่ลูกค้าได้จะถูกถอนคืน)?")) return;

// ---------- ยอดต่อคนของบิล (F/G) ----------
function splitId(id) { const i = id.lastIndexOf("|"); return [id.slice(0, i), id.slice(i + 1)]; }
/** ยอดต่อคนจากไฟล์บิล + ที่แก้ค้างไว้ (ยังไม่บันทึก) */
function fileDem() {
  const m = {}, list = [];
  (S.bill.fileDemand || []).forEach(d => { const x = Object.assign({}, d); m[d.key + "|" + d.code] = x; list.push(x); });
  Object.entries(S.dd || {}).forEach(([id, v]) => {
    let x = m[id];
    if (!x) { const [key, code] = splitId(id); x = m[id] = { key, code, customer: custName(code), label: "", base: 0, add: 0 }; list.push(x); }
    if ("base" in v) x.base = n0(v.base); if ("add" in v) x.add = n0(v.add);
  });
  return list;
}

// ---------- 2. ของเข้า + แบ่งของ ----------
function deriveBill() {
  const B = S.bill, BD = S.billDraft;
  const dem = {}, F = {}, G = {}, SF = {}, SG = {}, firstAt = {}, names = {};
  const add = (o, k, c, q) => { (o[k] = o[k] || {})[c] = (o[k][c] || 0) + q; };
  (B.demand || []).forEach(d => { add(dem, d.key, d.code, d.open); add(F, d.key, d.code, d.open);
    if (!firstAt[d.code] || d.importedAt < firstAt[d.code]) firstAt[d.code] = d.importedAt; names[d.code] = d.customer; });
  const fdl = fileDem();
  fdl.forEach((d, i) => {
    if (!d.base && !d.add) return;
    if (d.code === SHOP_CODE) { SF[d.key] = (SF[d.key] || 0) + d.base; SG[d.key] = (SG[d.key] || 0) + d.add; return; }
    add(dem, d.key, d.code, d.base + d.add); add(F, d.key, d.code, d.base); add(G, d.key, d.code, d.add);
    if (!(d.code in firstAt)) firstAt[d.code] = "0" + String(i).padStart(6, "0");
    names[d.code] = names[d.code] || d.customer || custName(d.code);
  });
  const saved = {}; B.allocs.forEach(a => { if (a.code) saved[a.key + "|" + a.code] = a.qty; });
  const hasSaved = B.allocs.some(a => a.code);
  const wsCodes = Object.keys(firstAt).filter(c => c !== SHOP_CODE).sort((a, b) => String(firstAt[a]).localeCompare(String(firstAt[b])));
  B.allocs.forEach(a => { if (a.code && a.code !== SHOP_CODE && !wsCodes.includes(a.code)) { wsCodes.push(a.code); names[a.code] = a.customer; } });
  (S.ddCodes || []).forEach(c => { if (!wsCodes.includes(c) && c !== SHOP_CODE) { wsCodes.push(c); names[c] = custName(c); } });
  const item = {}; B.items.forEach(i => item[i.key] = i);
  const actual = k => (k in BD.actual) ? n0(BD.actual[k]) : item[k].actualQty;
  const addConf = k => (k in (BD.addConf || {})) ? n0(BD.addConf[k]) : n0(item[k].addConfirmed);
  const avail = k => actual(k) + addConf(k);
  const reserve = k => { const it = item[k]; if (k in BD.reserve) return n0(BD.reserve[k]); return isBlank(it.shopReserve) ? n0((B.preorders && B.preorders.reserve || {})[k]) : n0(it.shopReserve); };
  const fx = (k, c) => c === SHOP_CODE ? (SF[k] || 0) : ((F[k] || {})[c] || 0);
  const gx = (k, c) => c === SHOP_CODE ? (SG[k] || 0) : ((G[k] || {})[c] || 0);
  const shopOrdered = k => (dem[k] || {})[SHOP_CODE] || 0;
  const auto = {}, shopAuto = {};
  const sum = o => Object.values(o).reduce((s, v) => s + v, 0);
  B.items.forEach(it => {
    const k = it.key, av = avail(k), floor = Math.min(reserve(k), av);
    let rest = Math.max(0, av - floor);
    const sAll = Math.max(0, (SF[k] || 0) + (SG[k] || 0) - floor), sF = Math.max(0, (SF[k] || 0) - floor), sG = sAll - sF;
    const ws = wsCodes.filter(c => (dem[k] || {})[c]);
    let a = {};
    if (S.allocMethod === "fg") {
      const e1 = ws.filter(c => fx(k, c)).map(c => ({ id: c, qty: fx(k, c) })); if (sF) e1.push({ id: SHOP_CODE, qty: sF });
      const a1 = allocate(rest, e1, "prop"); rest -= sum(a1);
      const e2 = ws.filter(c => gx(k, c)).map(c => ({ id: c, qty: gx(k, c) })); if (sG) e2.push({ id: SHOP_CODE, qty: sG });
      const a2 = allocate(rest, e2, "prop");
      ws.forEach(c => a[c] = (a1[c] || 0) + (a2[c] || 0));

function importAddon() {

        const rows = {}; let out = 0;

        let code = ""; grid.slice(0, 4).forEach(r => (r || []).forEach(v => { const m = /ร้าน\s*:.*\(([^()]+)\)\s*$/.exec(hdr(v)); if (m && !code) code = m[1].trim(); }));

function invoiceXLSX(inv) {
  const st = inv.settings || S.boot.settings || {}, b = inv.bank;
  const aoa = [[st.ShopName || "Mewtoy", "", "", "", "", "ใบแจ้งหนี้ / Invoice"], [st.ShopAddress || "", "", "", "", "", "เลขที่ " + inv.invoiceNo],
    [st.ShopTaxId ? "เลขผู้เสียภาษี " + st.ShopTaxId : "", "", "", "", "", "วันที่ " + fmtDate(inv.date)], [],
    ["ลูกค้า: " + inv.customer + " (" + inv.code + ")"], [], ["#", "บาร์โค้ด", "รายการ", "จำนวน", "ราคา/ชิ้น", "ลด %", "จำนวนเงิน"]];
  inv.lines.forEach(l => aoa.push([l.no, l.barcode, l.name, l.qty, l.unitPrice, l.discPct || "", l.total]));
  aoa.push([]);
  const add = (k, v) => aoa.push(["", "", "", "", "", k, v]);
  add("รวมเป็นเงิน", inv.subtotal); if (inv.lineDiscount) add("ส่วนลดรายการ", -inv.lineDiscount); if (inv.billDiscount) add(`ส่วนลด ${inv.billDiscPct}%`, -inv.billDiscount);
  if (inv.vatPct) { add("ยอดก่อน VAT", inv.afterDiscount); add(`VAT ${inv.vatPct}%`, inv.vat); }
  add("ยอดสุทธิ", inv.total); if (inv.paid) { add("ชำระแล้ว", inv.paid); add("คงค้าง", r2(inv.total - inv.paid)); }
  if (b) { aoa.push([]); aoa.push(["โอนเข้าบัญชี: " + bankText(b)]); }
  if (inv.note) aoa.push(["หมายเหตุ: " + inv.note]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (let r = 7; r < 7 + inv.lines.length; r++) { const c = ws[XLSX.utils.encode_cell({ r, c: 1 })]; if (c) { c.t = "s"; c.v = String(c.v); } }
  ws["!cols"] = [{ wch: 4 }, { wch: 15 }, { wch: 46 }, { wch: 7 }, { wch: 10 }, { wch: 14 }, { wch: 13 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Invoice");
  XLSX.writeFile(wb, `${inv.invoiceNo}_${safeFile(inv.customer)}.xlsx`);
}

    <select class="sel" onchange="S.setRoles[${i}].role=this.value">${["Admin", "Office", "Store"].map(x => `<option ${x === r.role ? "selected" : ""}>${x}</option>`).join("")}</select>
    <button class="btn btn-d btn-s" onclick="S.setRoles.splice(${i},1); drawRoles()"><i class="fa-solid fa-xmark"></i></button></div>`).join("");
}

async function saveRolesUI() { await run(async () => { S.boot.roles = await api("saveRoles", { roles: S.setRoles }); toast("บันทึกสิทธิ์แล้ว"); }); }
async function saveCustSettingsUI() {
  const rows = Array.from(document.querySelectorAll("#view tr[data-code]")).map(tr => ({ code: tr.dataset.code, priceTier: tr.querySelector(".cs-tier").value,
    discPct: tr.querySelector(".cs-disc").value.trim(), vatPct: tr.querySelector(".cs-vat").value.trim(), bankId: tr.querySelector(".cs-bank").value }));
  const changed = rows.filter(r => { const c = custSet(r.code); return String(c.priceTier || "") !== r.priceTier || String(c.discPct ?? "") !== r.discPct || String(c.vatPct ?? "") !== r.vatPct || String(c.bankId || "") !== r.bankId; });
  if (!changed.length) return toast("ไม่มีอะไรเปลี่ยน");
  await run(async () => { await api("saveCustomerSettings", { customers: changed }); await loadBoot(); toast(`บันทึก ${changed.length} ร้าน`); renderSettings(document.getElementById("view")); });
}

async function runDiag() {
  const box = document.getElementById("diagBox"); box.innerHTML = `<div class="muted text-sm mt-2"><i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจ…</div>`;
  const t = Date.now();
  await run(async () => {
    const D = await api("diag"), rt = Date.now() - t;
    box.innerHTML = `<div class="mt-3 text-sm space-y-2">
      <div>เวอร์ชันหลังบ้าน <b>${esc(D.version)}</b> · ผูกกับไฟล์ <b>${esc(D.file.name)}</b> · ตรวจใช้เวลา ${fmt(D.ms)} ms (รวมเน็ต ${fmt(rt)} ms)</div>
      ${D.warnings.length ? `<div class="rounded-lg bg-red-50 text-red-800 p-2">${D.warnings.map(w => "⚠ " + esc(w)).join("<br>")}</div>` : `<div class="rounded-lg bg-green-50 text-green-800 p-2">✓ ไม่พบปัญหา</div>`}
      <div class="overflow-auto"><table class="g"><thead><tr><th>ไฟล์ POS</th><th>ไฟล์/แท็บ</th><th class="num">รายการ</th><th class="num">ms</th></tr></thead><tbody>
        ${D.ext.map(x => `<tr><td>${esc(x.label)}</td><td>${x.error ? `<span class="text-red-700">${esc(x.error)}</span>` : esc(x.file + " · " + x.tab)}</td><td class="num">${x.count == null ? "—" : fmt(x.count)}</td><td class="num ${x.ms > 3000 ? "text-red-700 font-bold" : ""}">${fmt(x.ms)}</td></tr>`).join("")}</tbody></table></div>
      <div class="overflow-auto"><table class="g"><thead><tr><th>แท็บใน PM</th><th class="num">แถว</th><th>หมายเหตุ</th></tr></thead><tbody>
        ${D.tabs.map(x => `<tr><td>${esc(x.name)}</td><td class="num">${x.rows == null ? "ยังไม่มี" : fmt(x.rows)}</td><td class="text-xs">${(x.misplaced || []).length ? `<span class="text-red-700">คอลัมน์สลับ: ${esc(x.misplaced.join(", "))}</span>` : (x.missing || []).length ? `<span class="muted">จะเพิ่มให้เอง: ${esc(x.missing.join(", "))}</span>` : ""}</td></tr>`).join("")}</tbody></table></div>
    </div>`;
  });
}
